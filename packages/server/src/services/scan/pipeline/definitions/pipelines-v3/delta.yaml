stages:
  delta-scope:
    name: Delta Scope
    description: Scope changed repository targets for a delta scan.
    role: scan
    group: delta
    concurrency: 1
    disableable: false
    runtime:
      kind: agent
      persistent: false
      reuseContainer: true
      nullableOutput: false
      cwd: /workspace/repo
      skills:
        - delta-scope
      prompt: |
        You are the Delta Scope stage for a delta scan job.
        {{taskIsolation}}
        Use the installed skill named delta-scope as your working method.
        The delta-scope skill file is $VULSEEK_AGENT_HOME/skills/delta-scope/SKILL.md.
        Do not emit candidate, candidate_batch, module, analysis, verification, or triage results.
        Choose functions only by diff impact from base to target. Do not decide whether a vulnerability candidate exists.
        Repository id: {{repositoryId}}.
        Repository name: {{repositoryName}}.
        Target ref: {{targetRef}}.
        Target tag: {{targetTag}}.
        Target commit: {{targetCommit}}.
        Base commit: {{baseCommit}}.
        Commit window k: {{commitWindow}}.
        Diff range: {{baseCommit}}..{{targetCommit}}.
        {{agentInstruction}}
        Repository state JSON: {{repositoryStatePath}}.
        Read repository state before analysis and work from /workspace/repo at the checked-out target revision.
        Use git diff, rg, sed, tree-sitter, and local code inspection to identify functions that were changed by or are directly impacted by the diff.
        Write the repository object to /task/repository.json.
        Write each affected target object to /task/targets/<target-id>.json.
        Every target object must satisfy the target schema. Use moduleId "delta-scope" and moduleName "Delta Scope" unless a more precise existing logical module is obvious from local code context.
        Write one logical Delta Scope module object to /task/module.json and one threat model object to /task/outputs/module-threat-model.json.
        Return a schema-valid path manifest: repository is /task/repository.json, module is /task/module.json, threatModel is /task/outputs/module-threat-model.json, and functions is the list of function JSON file paths.
        If no affected functions exist, still write /task/repository.json and return exactly `{ "repository": "/task/repository.json", "functions": [] }`.
        Before returning, validate the structured JSON against the runtime-provided output.schema.json.
        Set output.json exit to true so Vulseek can discard this Delta Scope lane after end_turn.
      prepareRepository: diff
      includePolicy: false
      plugins: []
    inputSchema:
      $ref: "#/schemas/null-stage-input"
    outputSchema:
      $ref: "#/schemas/delta-scope-manifest"
    inputArtifacts: []
    outputArtifacts: []
    effects: []
    taskName: $ctx.projectName
    containerNameParts: []
    allowAgentExit: false
    promptValues:
      repositoryId: $ctx.taskId
      repositoryName: $ctx.serviceName
      targetRef: $ctx.scanJob.targetRef
      targetTag: $ctx.scanJob.targetTag
      targetCommit: $ctx.scanJob.commitSha
      baseCommit: $ctx.scanJob.baseSha
      commitWindow: $ctx.scanJob.commitWindow
      agentInstruction: Use the configured scan agent.
      repositoryStatePath: $ctx.taskDir/00_repository_state.json
  scan-target:
    name: Scan Target
    description: Target-level candidate discovery.
    role: scan
    group: full-scan
    concurrency: 4
    disableable: true
    runtime:
      kind: agent
      persistent: false
      reuseContainer: true
      nullableOutput: true
      cwd: /workspace/repo
      skills:
        - scan-target
      prompt: |
        You are the Scan Target stage for one full-scan target task.
        {{taskIsolation}}
        Use the installed skill named scan-target as your working method.
        The scan-target skill file is $VULSEEK_AGENT_HOME/skills/scan-target/SKILL.md.
        scan_job_id: {{scanJobId}}
        module_id: {{moduleId}}
        module_name: {{moduleName}}
        target_id: {{targetId}}
        target_name: {{targetName}}
        target_kind: {{targetKind}}
        target_file: {{targetFile}}
        target_line: {{targetLine}}
        target_summary: {{targetSummary}}
        {{thinkingInstruction}}
        repository_json_path: {{repositoryJsonPath}}
        module_json_path: {{moduleJsonPath}}
        threat_model_json_path: {{threatModelJsonPath}}
        target_json_path: {{targetJsonPath}}

        Read repository_json_path, module_json_path, threat_model_json_path, and target_json_path before analysis.
        Analyze this target for all concrete, security-relevant vulnerability candidates supported by the supplied repository, module, threat-model, and target context. Do not limit the analysis to a single vulnerability class, and do not claim final exploitability.
        The target may be a route, middleware, resolver, controller action, job handler, security config, template render point, parser, data-access boundary, or native function.
        Look for source -> missing/weak check -> sink paths across applicable vulnerability classes. Set each candidate.vulnerabilityType to the concrete class supported by its evidence.
        Write each candidate object to /task/candidates/<candidate-id>.json.
        Set candidate.targetId to target_id and candidate.targetKind to target_kind.
        Keep candidate.functionId null unless a legacy consumer requires the target id there.
        Return a schema-valid path manifest with a `candidates` array containing the candidate JSON file paths.
        Always return an object, even when there are no candidates; use `{ "candidates": [] }`.
        Before returning, validate the structured JSON against the runtime-provided output.schema.json.
      prepareRepository: none
      includePolicy: false
      plugins: []
    inputSchema:
      $ref: "#/schemas/scan-target-stage-input"
    outputSchema:
      $ref: "#/schemas/scan-target-manifest"
    inputArtifacts: []
    outputArtifacts: []
    effects:
      - type: sync-candidates
    taskName: $file($input.targetPath).targetName:$input.vulnerabilityClassFocus
    containerNameParts: []
    allowAgentExit: false
    promptValues:
      scanJobId: $ctx.scanJobId
      moduleId: $file($input.modulePath).id
      moduleName: $file($input.modulePath).name
      targetId: $file($input.targetPath).id
      targetName: $file($input.targetPath).name
      targetKind: $file($input.targetPath).targetKind
      vulnerabilityClassFocus: $input.vulnerabilityClassFocus
      targetFile: $file($input.targetPath).filePath
      targetLine: $file($input.targetPath).line
      targetSummary: $file($input.targetPath).summary
      repositoryJsonPath: $input.repositoryPath
      moduleJsonPath: $input.modulePath
      threatModelJsonPath: $input.threatModelPath
      targetJsonPath: $input.targetPath
  analyze-finding:
    name: Analyze Finding
    description: Candidate analysis and critic routing.
    role: analysis
    group: review
    concurrency: 2
    disableable: true
    runtime:
      kind: agent
      persistent: false
      reuseContainer: true
      nullableOutput: false
      cwd: /workspace/repo
      skills:
        - analyze-finding
      prompt: |
        You are the Analyze Finding agent for one vulnerability candidate.
        {{taskIsolation}}
        Work only on this candidate and decide whether it is a real issue.
        scan_job_id: {{scanJobId}}
        candidate_id: {{candidateId}}
        candidate_title: {{candidateTitle}}
        candidate_description: {{candidateDescription}}
        candidate_file: {{candidateFile}}
        candidate_line: {{candidateLine}}
        repository_json_path: {{repositoryJsonPath}}
        module_json_path: {{moduleJsonPath}}
        target_json_path: {{functionJsonPath}}
        candidate_json_path: {{candidateJsonPath}}
        analysis_report_template_path: {{analysisReportTemplatePath}}
        task_dir: {{taskDir}}
        write_report_to: {{reportPath}}
        feedback_json_path: {{feedbackJsonPath}}

        Use the installed skill named analyze-finding as your working method.
        The analyze-finding skill file is $VULSEEK_AGENT_HOME/skills/analyze-finding/SKILL.md.
        Follow the coordinator workflow and evidence rules defined in the skill.
        Read the JSON files referenced above before analysis. If feedback_json_path is not "none", read that JSON file too. If analysis_report_template_path is not "none", read that file and format the markdown report to match it.
        Write every task artifact only under task_dir.
        Decide whether this turn should submit a draft analysis to critic or finalize a critic-approved analysis.
        The selected object type must match the selected route key.
        Do not request fuzzer construction in this pipeline version. If dynamic evidence would materially change confidence, record it in blockers or missingEvidenceRequest instead.
        Before returning, validate the structured JSON against the runtime-provided output.schema.json.
        Use {{taskId}} as the id when the selected schema has an id field.
        Set reportPath to {{reportPath}} when returning an analysis result.
        When analysis_report_template_path is not "none", follow that file as the required markdown report template.
        Set runtimeSeconds to null if unknown.
        Set status to completed when the run succeeds.
        Route mapping:
        - analysisSchema draft for critic -> critic, when evidence is organized enough for adversarial review
        - finalAnalysisSchema after matching critic convinced response -> verification and set output.json exit to true
        Do not route verification unless the latest critic response is convinced for the same analysis fingerprint.
        Compute score as a 0-10 estimated severity score. Consider CVSS-style dimensions and real-world impact breadth, including whether the vulnerable path appears in common usage scenarios.

        Recommended result enum values:
        - real_vulnerability
        - likely_vulnerability
        - plausible_but_unproven
        - false_positive
      prepareRepository: none
      includePolicy: false
      plugins: []
    inputSchema:
      $ref: "#/schemas/analyze-finding-stage-input"
    outputSchema:
      $ref: "#/schemas/analysis"
    inputArtifacts: []
    outputArtifacts: []
    effects:
      - type: project-candidate-result
        resultStage: analyze
    report:
      path: /task/01_report.md
      required: true
    taskName: "Candidate Analysis: $file($input.candidatePath).title"
    containerNameParts: []
    allowAgentExit: false
    promptValues:
      scanJobId: $ctx.scanJobId
      candidateId: $file($input.candidatePath).id
      candidateTitle: $file($input.candidatePath).title
      candidateDescription: $file($input.candidatePath).description
      candidateFile: $file($input.candidatePath).filePath
      candidateLine: $file($input.candidatePath).line
      repositoryJsonPath: $input.repositoryPath
      moduleJsonPath: $input.modulePath
      functionJsonPath: $input.functionPath
      candidateJsonPath: $input.candidatePath
      analysisReportTemplatePath: $input.analysisReportTemplatePath
      taskDir: $ctx.taskDir
      reportPath: /task/01_report.md
      feedbackJsonPath: $input.feedbackPath
      taskId: $ctx.taskId
  critique-finding:
    name: Critique Finding
    description: Challenge analysis results before verification.
    role: analysis
    group: review
    concurrency: 2
    disableable: true
    runtime:
      kind: agent
      persistent: false
      reuseContainer: true
      nullableOutput: false
      cwd: /workspace/repo
      skills:
        - critique-finding
      prompt: |
        You are the critic agent for one vulnerability analysis.
        {{taskIsolation}}
        Use the installed skill named critique-finding as your working method.
        The critique-finding skill file is $VULSEEK_AGENT_HOME/skills/critique-finding/SKILL.md.
        candidate_id: {{candidateId}}
        candidate_title: {{candidateTitle}}
        candidate_json_path: {{candidateJsonPath}}
        task_dir: {{taskDir}}
        analysis_fingerprint: {{analysisFingerprint}}
        draft_analysis_json_path: {{draftAnalysisJsonPath}}

        Follow the criticize skill for the detailed adversarial review checklist.
        Read candidate_json_path and draft_analysis_json_path before review.
        Use stance=convinced only when the analysis survives sanity/review checks and has enough evidence for verification.
        If you are convinced, set stance to convinced and bind reviewedAnalysisFingerprint to the draft analysis fingerprint supplied by the analysis agent.
        Before returning, validate the structured JSON against the runtime-provided output.schema.json.
        Use {{taskId}} as id.
        Always route back to analysis.
      prepareRepository: none
      includePolicy: false
      plugins: []
    inputSchema:
      $ref: "#/schemas/critique-finding-stage-input"
    outputSchema:
      $ref: "#/schemas/critic-response"
    inputArtifacts: []
    outputArtifacts: []
    effects: []
    taskName: "Analysis Critic: $file($input.candidatePath).title"
    containerNameParts: []
    allowAgentExit: false
    promptValues:
      candidateId: $file($input.candidatePath).id
      candidateTitle: $file($input.candidatePath).title
      taskDir: $ctx.taskDir
      analysisFingerprint: $input.analysisFingerprint
      candidateJsonPath: $input.candidatePath
      draftAnalysisJsonPath: $input.draftAnalysisPath
      taskId: $ctx.taskId
  verify-finding:
    name: Verify Finding
    description: Fact-check target, paths, and evidence.
    role: verification
    group: review
    concurrency: 1
    disableable: true
    runtime:
      kind: agent
      persistent: false
      reuseContainer: true
      nullableOutput: false
      cwd: /workspace/repo
      skills:
        - verify-finding
      prompt: |
        You are the sanity-check verifier agent for one vulnerability candidate.
        {{taskIsolation}}
        Work only on this candidate and validate the factual basis of the existing analysis result.
        scan_job_id: {{scanJobId}}
        candidate_id: {{candidateId}}
        candidate_title: {{candidateTitle}}
        candidate_description: {{candidateDescription}}
        candidate_file: {{candidateFile}}
        candidate_line: {{candidateLine}}
        analysis_result: {{analysisResult}}
        analysis_summary: {{analysisSummary}}
        analysis_fingerprint: {{analysisFingerprint}}
        critic_approval: {{criticApproval}}
        critic_task_id: {{criticTaskId}}
        analysis_report_path: {{analysisReportPath}}
        repository_json_path: {{repositoryJsonPath}}
        module_json_path: {{moduleJsonPath}}
        target_json_path: {{functionJsonPath}}
        candidate_json_path: {{candidateJsonPath}}
        analysis_result_json_path: {{analysisResultJsonPath}}
        task_dir: {{taskDir}}
        write_verify_report_to: {{reportPath}}

        Use the installed skill named verify-finding as your working method.
        The verify-finding skill file is $VULSEEK_AGENT_HOME/skills/verify-finding/SKILL.md.
        Read the JSON files referenced above before verification.
        Do not repeat broad exploration. This stage is a sanity check only.
        Check whether the analysis report's factual claims, code paths, target descriptions, symbols, data-flow descriptions, and trigger/precondition descriptions really exist or basically hold in the repository.
        Do not judge security impact, exploitability, CVSS, EPSS, whether this is a bug, or whether it should be reported as a vulnerability. Those decisions belong to triage.
        Write a concise markdown sanity-check report to write_verify_report_to.
        Write every task artifact only under task_dir.
        Before returning, validate the structured JSON against the runtime-provided output.schema.json.
        Set id to {{taskId}}.
        Set reportPath to {{reportPath}}.
        Set runtimeSeconds to null if unknown.
        Set status to completed when the run succeeds.
        Set result to the JSON string "true", "likely", or "false".
        Do not return boolean true/false.
        Use result exactly as:
        - "true": core facts, paths, code locations, and trigger conditions are present and materially support the analysis.
        - "likely": most core facts hold, but some uncertainty remains that does not clearly refute the analysis.
        - "false": a central factual claim, code path, trigger, or precondition is absent or contradicted.
      prepareRepository: none
      includePolicy: false
      plugins: []
    inputSchema:
      $ref: "#/schemas/verify-finding-stage-input"
    outputSchema:
      $ref: "#/schemas/verification"
    inputArtifacts: []
    outputArtifacts: []
    effects:
      - type: project-candidate-result
        resultStage: verify
    report:
      path: /task/01_verify_report.md
      required: true
    taskName: "Candidate Verification: $file($input.candidatePath).title"
    containerNameParts: []
    allowAgentExit: false
    promptValues:
      scanJobId: $ctx.scanJobId
      candidateId: $file($input.candidatePath).id
      candidateTitle: $file($input.candidatePath).title
      candidateDescription: $file($input.candidatePath).description
      candidateFile: $file($input.candidatePath).filePath
      candidateLine: $file($input.candidatePath).line
      analysisResult: $file($input.analysisResultPath).result
      analysisSummary: $file($input.analysisResultPath).summary
      analysisFingerprint: $file($input.analysisResultPath).analysisFingerprint
      criticApproval: $file($input.analysisResultPath).criticApproval.summary
      criticTaskId: $file($input.analysisResultPath).criticApproval.criticTaskId
      analysisReportPath: $file($input.analysisResultPath).reportPath
      repositoryJsonPath: $input.repositoryPath
      moduleJsonPath: $input.modulePath
      functionJsonPath: $input.functionPath
      candidateJsonPath: $input.candidatePath
      analysisResultJsonPath: $input.analysisResultPath
      taskDir: $ctx.taskDir
      reportPath: /task/01_verify_report.md
      taskId: $ctx.taskId
  triage-finding:
    name: Triage Finding
    description: Final security classification and severity.
    role: verification
    group: review
    concurrency: 1
    disableable: true
    runtime:
      kind: agent
      persistent: false
      reuseContainer: true
      nullableOutput: false
      cwd: /workspace/repo
      skills:
        - triage-finding
      prompt: |
        You are the triage agent for one sanity-checked vulnerability candidate.
        {{taskIsolation}}
        Work only on this candidate and classify security impact after verify passed.
        Use the installed skill named triage-finding as your working method.
        The triage-finding skill file is $VULSEEK_AGENT_HOME/skills/triage-finding/SKILL.md.
        scan_job_id: {{scanJobId}}
        candidate_id: {{candidateId}}
        candidate_title: {{candidateTitle}}
        candidate_description: {{candidateDescription}}
        candidate_file: {{candidateFile}}
        candidate_line: {{candidateLine}}
        analysis_result: {{analysisResult}}
        analysis_summary: {{analysisSummary}}
        verify_result: {{verifyResult}}
        verify_summary: {{verifySummary}}
        repository_json_path: {{repositoryJsonPath}}
        module_json_path: {{moduleJsonPath}}
        target_json_path: {{functionJsonPath}}
        candidate_json_path: {{candidateJsonPath}}
        analysis_result_json_path: {{analysisResultJsonPath}}
        verify_result_json_path: {{verifyResultJsonPath}}
        task_dir: {{taskDir}}
        write_triage_report_to: {{reportPath}}

        Read the JSON files referenced above before triage.
        Use verify only as a factual sanity-check input. Do not reinterpret verify as a security verdict.
        Classify whether the sanity-checked facts amount to a security issue, non-security bug, hardening finding, or unresolved review item.
        Evaluate disqualifiers before assigning the final security classification. Set disqualifier to null and disqualifierReason to null when no disqualifier applies. If a disqualifier applies, set disqualifierReason to the concrete evidence-based reason.
        - D-0: the vulnerability hypothesis is disproven by code, runtime evidence, or verification facts.
        - D-1: the affected path is only test, mock, example, fixture, sample, benchmark, or dead code.
        - D-1.5: privilege tautology; exploitation already requires the exact privilege or authority that the alleged impact would grant.
        - D-2: required preconditions are unrealistic, contradictory to supported deployments, or require attacker powers outside the threat model.
        - D-3: the claim depends on hedging language or unverifiable speculation that cannot be validated from available evidence.
        - D-4: the behavior has no security impact; it may be a normal bug, robustness issue, or quality issue only.
        - D-5: API misuse or violation of an explicit code/API contract causes the finding; use this for contract errors that should be tracked but are not a confirmed vulnerability by themselves. Do not use D-5 to dismiss a contract violation that produces attacker-controllable security impact.
        When a disqualifier applies, keep result, securityClassification, CVSS, and exploitability consistent with that disqualification.
        Assess CVSS, exploitability, common trigger conditions, and whether this is security impact versus robustness/hardening.
        For EPSS, prefer an official CVE/EPSS mapping when the candidate clearly maps to a CVE. If no CVE maps, provide a heuristic 30-day probability estimate and set epssSource to describe that fallback.
        Write a concise markdown triage report to write_triage_report_to, including the selected disqualifier and disqualifierReason when present.
        Write every task artifact only under task_dir.
        Before returning, validate the structured JSON against the runtime-provided output.schema.json.
        Set id to {{taskId}}.
        Set reportPath to {{reportPath}}.
        Set runtimeSeconds to null if unknown.
        Set status to completed when the run succeeds.
      prepareRepository: none
      includePolicy: false
      plugins: []
    inputSchema:
      $ref: "#/schemas/triage-finding-stage-input"
    outputSchema:
      $ref: "#/schemas/triage"
    inputArtifacts: []
    outputArtifacts: []
    effects:
      - type: project-candidate-result
        resultStage: triage
    report:
      path: /task/01_triage_report.md
      required: true
    taskName: "Candidate Triage: $file($input.candidatePath).title"
    containerNameParts: []
    allowAgentExit: false
    promptValues:
      scanJobId: $ctx.scanJobId
      candidateId: $file($input.candidatePath).id
      candidateTitle: $file($input.candidatePath).title
      candidateDescription: $file($input.candidatePath).description
      candidateFile: $file($input.candidatePath).filePath
      candidateLine: $file($input.candidatePath).line
      analysisResult: $file($input.analysisResultPath).result
      analysisSummary: $file($input.analysisResultPath).summary
      verifyResult: $file($input.verifyResultPath).result
      verifySummary: $file($input.verifyResultPath).summary
      repositoryJsonPath: $input.repositoryPath
      moduleJsonPath: $input.modulePath
      functionJsonPath: $input.functionPath
      candidateJsonPath: $input.candidatePath
      analysisResultJsonPath: $input.analysisResultPath
      verifyResultJsonPath: $input.verifyResultPath
      taskDir: $ctx.taskDir
      reportPath: /task/01_triage_report.md
      taskId: $ctx.taskId
edges:
  - id: delta-scope-to-function
    name: delta-scope-to-function
    from: delta-scope
    to: scan-target
    fork: false
    mode: fanOut
    foreach: $.functions[*]
    input:
      scanJob: $ctx.scanJob
      repositoryPath: $.repository
      modulePath: $.module
      threatModelPath: $.threatModel
      targetPath: $item
      moduleId: delta-scope
      moduleName: Delta Scope
      targetId: ""
      targetName: ""
      targetKind: function
      priority: null
      vulnerabilityClassFocus: delta-scoped
    artifacts:
      - from: $input.repositoryPath
        to: inputs/repository.json
        inputField: repositoryPath
        required: true
      - from: $input.modulePath
        to: inputs/module.json
        inputField: modulePath
        required: true
      - from: $input.threatModelPath
        to: inputs/threat-model.json
        inputField: threatModelPath
        required: true
      - from: $input.targetPath
        to: inputs/target.json
        inputField: targetPath
        required: true
  - id: scan-target-to-analyze-finding
    name: scan-target-to-analyze-finding
    from: scan-target
    to: analyze-finding
    fork: false
    mode: fanOut
    foreach: $.candidates[*]
    input:
      scanJob: $input.scanJob
      repositoryPath: $input.repositoryPath
      modulePath: $input.modulePath
      functionPath: $input.targetPath
      candidatePath: $item
    artifacts:
      - from: $input.repositoryPath
        to: inputs/repository.json
        inputField: repositoryPath
        required: true
      - from: $input.modulePath
        to: inputs/module.json
        inputField: modulePath
        required: false
      - from: $input.functionPath
        to: inputs/target.json
        inputField: functionPath
        required: true
      - from: $input.candidatePath
        to: inputs/candidate.json
        inputField: candidatePath
        required: true
  - id: analyze-finding-to-critique-finding
    name: analyze-finding-to-critique-finding
    from: analyze-finding
    to: critique-finding
    fork: false
    mode: map
    input:
      scanJob: $input.scanJob
      repositoryPath: $input.repositoryPath
      modulePath: $input.modulePath
      functionPath: $input.functionPath
      candidatePath: $input.candidatePath
      draftAnalysisPath: ""
      analysisFingerprint: $computed.analysisFingerprint
    artifacts:
      - from: $input.repositoryPath
        to: inputs/repository.json
        inputField: repositoryPath
        required: true
      - from: $input.modulePath
        to: inputs/module.json
        inputField: modulePath
        required: false
      - from: $input.functionPath
        to: inputs/target.json
        inputField: functionPath
        required: true
      - from: $input.candidatePath
        to: inputs/candidate.json
        inputField: candidatePath
        required: true
      - from: $output
        to: inputs/analysis.json
        inputField: draftAnalysisPath
        required: true
    outputSchema:
      $ref: "#/schemas/analysis"
    outputSchemaDescription: Draft analysisSchema result for critic review
    route:
      key: critic
      default: true
  - id: critique-finding-to-analyze-finding
    name: critique-finding-to-analyze-finding
    from: critique-finding
    to: analyze-finding
    fork: false
    mode: map
    input:
      scanJob: $input.scanJob
      repositoryPath: $input.repositoryPath
      modulePath: $input.modulePath
      functionPath: $input.functionPath
      candidatePath: $input.candidatePath
      feedbackPath: ""
    artifacts:
      - from: $input.repositoryPath
        to: inputs/repository.json
        inputField: repositoryPath
        required: true
      - from: $input.modulePath
        to: inputs/module.json
        inputField: modulePath
        required: false
      - from: $input.functionPath
        to: inputs/target.json
        inputField: functionPath
        required: true
      - from: $input.candidatePath
        to: inputs/candidate.json
        inputField: candidatePath
        required: true
      - from: $output
        to: inputs/feedback.json
        inputField: feedbackPath
        required: true
    outputSchema:
      $ref: "#/schemas/critic-response"
    outputSchemaDescription: CriticResponse feedback for analysis
    route:
      key: analysis
      default: true
  - id: analyze-finding-to-verify-finding
    name: analyze-finding-to-verify-finding
    from: analyze-finding
    to: verify-finding
    fork: false
    mode: map
    input:
      scanJob: $input.scanJob
      repositoryPath: $input.repositoryPath
      modulePath: $input.modulePath
      functionPath: $input.functionPath
      candidatePath: $input.candidatePath
      analysisResultPath: ""
    artifacts:
      - from: $input.repositoryPath
        to: inputs/repository.json
        inputField: repositoryPath
        required: true
      - from: $input.modulePath
        to: inputs/module.json
        inputField: modulePath
        required: false
      - from: $input.functionPath
        to: inputs/target.json
        inputField: functionPath
        required: true
      - from: $input.candidatePath
        to: inputs/candidate.json
        inputField: candidatePath
        required: true
      - from: $output
        to: inputs/analysis.json
        inputField: analysisResultPath
        required: true
    outputSchema:
      $ref: "#/schemas/final-analysis"
    outputSchemaDescription: Final critic-approved analysis result
    route:
      key: verification
      default: false
  - id: verify-finding-to-triage-finding
    name: verify-finding-to-triage-finding
    from: verify-finding
    to: triage-finding
    fork: false
    mode: map
    input:
      scanJob: $input.scanJob
      repositoryPath: $input.repositoryPath
      modulePath: $input.modulePath
      functionPath: $input.functionPath
      candidatePath: $input.candidatePath
      analysisResultPath: $input.analysisResultPath
      verifyResultPath: ""
    artifacts:
      - from: $input.repositoryPath
        to: inputs/repository.json
        inputField: repositoryPath
        required: true
      - from: $input.modulePath
        to: inputs/module.json
        inputField: modulePath
        required: false
      - from: $input.functionPath
        to: inputs/target.json
        inputField: functionPath
        required: true
      - from: $input.candidatePath
        to: inputs/candidate.json
        inputField: candidatePath
        required: true
      - from: $input.analysisResultPath
        to: inputs/analysis.json
        inputField: analysisResultPath
        required: true
      - from: $output
        to: inputs/verification.json
        inputField: verifyResultPath
        required: true
    outputSchema:
      $ref: "#/schemas/verification"
groups: []
