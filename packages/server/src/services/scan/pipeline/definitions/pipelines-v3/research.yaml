stages:
  research-scope:
    name: Research Scope
    description: Define the attacker model, trusted domain, protected assets, and success criteria for this research job.
    role: scan
    group: research
    mode: serial
    concurrency: 1
    disableable: false
    runtime:
      kind: agent
      persistent: false
      reuseContainer: true
      cwd: /workspace/repo
      skills:
        - research-agent
        - research-db
      prompt: |
        You are the Research Scope stage for a generic security research job.

        Read the target project source and `/task/inputs/task-input.json`. Define the attacker starting point, trusted domain, protected assets, deployment assumptions, permitted information sources, and success criteria supplied by the job. Do not invent project-specific assumptions. The minimum research deadline is {{researchDeadlineAt}}; include it in the scope artifact and do not conclude the research as exhausted before that deadline unless the job is explicitly stopped. Write the complete scope object to /task/scope.json.

        Persist the scope as the reserved Track `__scope__` using the research-db skill. Use a stable Track ID derived from the current scan job (for example `scope-{{scanJobId}}`), create it with `approachFamily=scope`, `researchIdea=job scope`, `status=active`, and the complete scope object, or read and update it with the current revision when it already exists. Resolve conflicts with the documented three-round CAS loop. Do not include `__scope__` in the ordinary research tracks returned by Track Planning.

        Return {"scopePath":"/task/scope.json"} in output only after the scope artifact and reserved Track write have succeeded.
      prepareRepository: target
      includePolicy: false
      plugins: []
    inputSchema:
      $ref: "#/schemas/research-scope-stage-input"
    outputSchema:
      $ref: "#/schemas/scope-manifest"
    inputArtifacts: []
    outputArtifacts: []
    effects: []
    containerNameParts: []
    allowAgentExit: false
    promptValues: {}
  surface-map:
    name: Surface Mapping
    description: Map attacker-facing entrypoints, trust boundaries, sources, sinks, and dependency flows.
    role: scan
    group: research
    mode: serial
    concurrency: 1
    disableable: false
    runtime:
      kind: agent
      persistent: false
      reuseContainer: true
      cwd: /workspace/repo
      skills:
        - research-agent
      prompt: |
        You are the Surface Mapping stage for a generic security research job.

        Read the scope artifact before inspecting source. Enumerate attacker-facing entrypoints, trust boundaries, sources, sinks, runtime components, dependency flows, coverage, and open questions. Do not claim exploitability. Write the inventory to /task/surface-map.json and return {"surfaceMapPath":"/task/surface-map.json"} in output.
      prepareRepository: none
      includePolicy: false
      plugins: []
    inputSchema:
      type: object
    outputSchema:
      $ref: "#/schemas/surface-map-manifest"
    inputArtifacts: []
    outputArtifacts: []
    effects: []
    containerNameParts: []
    allowAgentExit: false
    promptValues: {}
  track-plan:
    name: Track Planning
    description: Select diverse research tracks from surface coverage and Registry state.
    role: scan
    group: research
    mode: serial
    concurrency: 1
    disableable: true
    runtime:
      kind: agent
      persistent: false
      reuseContainer: true
      cwd: /workspace/repo
      skills:
        - research-agent
        - research-db
      prompt: |
        You are the serial Track Planning stage for a generic security research job. This stage is the only owner of the global Track portfolio: creation, deduplication, ordering, prioritization, and cross-Track adjustments happen here. Track Review tasks only decide what to do next for their current Track and must not be treated as a source of global portfolio mutations.

        Read the scope and surface artifacts. Use the research-db skill to inspect current tracks, findings, primitives, and chains. Select materially different approach families, preserve underexplored routes, and turn primitive gaps into targeted tracks. Persist every new or changed Track directly with `create-track` or `update-track`; use the returned revision and the read -> CAS conflict loop from the skill. Do not wait for TypeScript to persist the returned array. Return an object containing the persisted tracks and the current iteration. Every track must contain a stable non-empty trackKey, approachFamily, researchIdea, scope object, and mechanisms string array; do not use id, candidateId, or a generated random identifier. Do not validate findings.

        Treat the reserved `__scope__` Track as read-only context and never include it in the returned `tracks` array or downstream Discovery tasks.

        Finding references are ownership data, not general context. Only put a Finding ID in a Track's findingIds when that Finding is already owned by the same Track. For a new Track, return findingIds as an empty array; mention related Findings only as context in coverage or researchIdea. Never copy an existingFinding or findingIds from another Track into a new Track. When updating an existing Track, preserve its complete existing findingIds set exactly.
      prepareRepository: none
      includePolicy: false
      plugins: []
    inputSchema:
      type: object
    outputSchema:
      $ref: "#/schemas/track-plan"
    inputArtifacts: []
    outputArtifacts: []
    effects: []
    containerNameParts: []
    allowAgentExit: false
    promptValues: {}
  vulnerability-discovery:
    name: Vulnerability Discovery
    description: Trace attacker-controlled data through one assigned research track.
    role: scan
    group: research
    mode: fanout
    concurrency: 8
    disableable: true
    runtime:
      kind: agent
      persistent: false
      reuseContainer: true
      cwd: /workspace/repo
      skills:
        - research-agent
        - research-db
      prompt: |
        You are the Vulnerability Discovery stage for one assigned research track.

        Use the exact canonical `track.trackId` supplied in the task input and task
        context for the Discovery Report `trackId`. It is a Registry entity ID, not
        the human-readable `track.trackKey`; never substitute the key for the ID.
        If the ID is absent, run `research-db list-tracks`, find the row whose
        `trackKey` exactly matches the assigned track, and use that row's `trackId`.
        If no exact row exists, stop and report the identity error instead of
        inventing an ID.

        Read the scope and surface artifacts and inspect only the assigned track's target scope. Trace attacker-controlled data through parsing, guards, transformations, persistence, queues, and sinks. Record precise source evidence, quick disproof attempts, Research Findings, and materially new track suggestions.

        Write each Finding as one strict JSON object in its own `/task/findings/<safe-finding-id>.json` file. Every Finding must use the strict Finding artifact shape and set `findingId` to exactly `trackKey:rootCauseKey`, with one colon separator and no `::`, spaces, or alternate delimiter. For example, `admin-dispatch-csrf:ajax-dismiss-pointer-commented-out-nonce`. Do not embed Finding objects in the Discovery Report and do not JSON-encode a Finding as a string.

        Write the full report to `/task/discovery-report.json`. Its `findingPaths` array must contain the `/task/findings/*.json` paths in deterministic order. Validate the report and every Finding artifact before returning the report path and track identifier.

        After validating each Finding artifact, persist it directly with the `research-db create-finding` command. Use the exact current Track ID and the stable Finding ID from the artifact. If the Finding already exists, read it and use the revision conflict loop; never silently overwrite a different Finding. Update the owning Track's absolute `findingIds` set only with IDs that this Track owns, using `update-track` and its expected revision. A successful Discovery task must leave the database rows committed before returning its report.

        Before ending the turn, you must also write `/task/output.json` yourself. It must be the final structured envelope, not a prose response:

        ```json
        {"route":null,"exit":false,"output":{"trackId":"<the assigned track identifier>","discoveryReportPath":"/task/discovery-report.json"}}
        ```

        Replace the placeholder with the exact assigned `trackId`. This write is mandatory even when the report contains no Findings. Re-open `/task/output.json` and validate it against `/task/output.schema.json` immediately before ending the turn.
      prepareRepository: none
      includePolicy: false
      plugins: []
    inputSchema:
      type: object
    outputSchema:
      $ref: "#/schemas/discovery-manifest"
    inputArtifacts: []
    outputArtifacts: []
    effects: []
    containerNameParts: []
    allowAgentExit: false
    promptValues: {}
  track-review:
    name: Track Review
    description: Review discovery results and route tracks, findings, or new surfaces.
    role: verification
    group: research
    mode: fanout
    concurrency: 4
    disableable: true
    runtime:
      kind: agent
      persistent: false
      reuseContainer: true
      cwd: /workspace/repo
      skills:
        - research-agent
        - research-db
      prompt: |
        You are the Track Review stage for a generic security research job.

        Review only the current Track supplied in the task input. Read the discovery report for current-track context and use `research-db list-findings` to inspect persisted Findings owned by this Track. The report's `findingPaths` belong to the producing Discovery task; do not dereference those paths from this task. Track portfolio creation, deduplication, ordering, and changes to other Tracks belong exclusively to the serial Track Planning stage. Do not create, block, exhaust, rank, or otherwise mutate another Track from this task.

        Return exactly one structured decision object with these fields: `trackKey`, `decision`, `summary`, `findingIds`, `coverageGaps`, `nextStep`, `blockReason`, and `reopenCondition`. `trackKey` must exactly match the current Track. `decision` must be one of `continue`, `finding-found`, `new-surface`, `blocked`, or `exhausted`; the pipeline route must use the same value. Put only non-empty Finding IDs owned by the current Track in `findingIds`, and use an empty array unless the decision is `finding-found`. Use a non-empty `blockReason` for `blocked`; otherwise use `null` when not applicable. Use `null` for `nextStep` or `reopenCondition` when not applicable. Do not return the legacy `continueTracks`, `newTracks`, `blockedTracks`, or `exhaustedTracks` buckets. Do not create a separate review file or return a `reviewPath`. Do not confirm a vulnerability.

        Before returning, update only the current Track through `research-db update-track` with an absolute `status`, `nextStep`, `blockReason`, `reopenCondition`, `coverage`, and `evidenceRefs` patch as applicable. Read the Track first, pass its current revision, and resolve a conflict by rereading and recomputing this Track's decision. Never create, block, exhaust, rank, or update another Track.
      prepareRepository: none
      includePolicy: false
      plugins: []
    inputSchema:
      type: object
    outputSchema:
      $ref: "#/schemas/track-review"
    inputArtifacts: []
    outputArtifacts: []
    effects: []
    containerNameParts: []
    allowAgentExit: false
    promptValues: {}
  finding-validation:
    name: Finding Validation
    description: Validate one finding and characterize the supported capability.
    role: analysis
    group: research
    mode: fanout
    concurrency: 8
    disableable: true
    runtime:
      kind: agent
      persistent: false
      reuseContainer: true
      cwd: /workspace/repo
      skills:
        - research-agent
        - research-db
      prompt: |
        You are the Finding Validation stage for one Research Finding.

        Read the scope, Finding data, discovery evidence, and relevant source. Verify attacker reachability, controllability, guards, trust-boundary crossings, deployment conditions, and a concrete disproof attempt. Describe only the capability supported by evidence. When a primitive is supported, set primitive to an object containing stable primitiveId, name, capability, requiredInput, producedCapability, trustLevel, and evidenceRefs. When no primitive is supported, set primitive to {}. Return only the structured validation object; do not write a validation artifact or return a file path because the pipeline persists the complete output for downstream stages.

        After writing and validating the artifact, use `research-db get-finding` to read the current revision and persist the validation outcome with `update-finding`. Set an absolute `status` and `latestValidationVerdict`, replace `requiredEvidence` when the validation identifies it, and resolve conflicts by rereading the Finding. If the validation supports a primitive, persist it directly with `create-primitive` using the stable `primitiveId`; if it already exists, reread it and apply an absolute `update-primitive` only when its desired values changed. Do not rely on TypeScript to create or update either entity.
      prepareRepository: none
      includePolicy: false
      plugins: []
    inputSchema:
      type: object
    outputSchema:
      $ref: "#/schemas/finding-validation"
    inputArtifacts: []
    outputArtifacts: []
    effects: []
    containerNameParts: []
    allowAgentExit: false
    promptValues: {}
  finding-review:
    name: Finding Review
    description: Independently challenge one finding validation result.
    role: verification
    group: research
    mode: fanout
    concurrency: 4
    disableable: true
    runtime:
      kind: agent
      persistent: false
      reuseContainer: true
      cwd: /workspace/repo
      skills:
        - research-agent
        - research-db
      prompt: |
        You are the independent Finding Review stage.

        Read the Finding and validation artifacts. Recheck the source-to-sink path independently, challenge omitted guards and deployment assumptions, and choose exactly one decision: confirmed, needs-more-evidence, or false-positive. When decision is confirmed, confirmedPrimitive must contain stable primitiveId, name, capability, requiredInput, producedCapability, trustLevel, and evidenceRefs. For needs-more-evidence or false-positive, set confirmedPrimitive to {}. Return the Finding ID, decision, a short summary of the review rationale, challenges, required evidence, and confirmed primitive. Do not write a separate review file or return a reviewPath. Do not broaden into unrelated discovery.

        Using the research-db skill, persist the review directly before returning: read the Finding revision, then use `update-finding` with an absolute `status`, `latestReviewDecision`, and `requiredEvidence`. For a confirmed primitive, use `create-primitive` or the revision conflict loop for an existing primitive. For a non-confirmed decision, do not create a primitive. A conflict must be reread and resolved by the Agent; no TypeScript Registry effect will apply this result.
      prepareRepository: none
      includePolicy: false
      plugins: []
    inputSchema:
      type: object
    outputSchema:
      $ref: "#/schemas/finding-review"
    inputArtifacts: []
    outputArtifacts: []
    effects: []
    containerNameParts: []
    allowAgentExit: false
    promptValues: {}
  chain-synthesis:
    name: Chain Synthesis
    description: Combine confirmed capabilities into exploit chains and identify gaps.
    role: analysis
    group: research
    mode: serial
    concurrency: 1
    disableable: true
    runtime:
      kind: agent
      persistent: false
      reuseContainer: true
      cwd: /workspace/repo
      skills:
        - research-agent
        - research-db
      prompt: |
        You are the Chain Synthesis stage for a generic security research job.

        Use research-db to inspect confirmed primitives, finding reviews, prior chains, and primitive gaps. Build only chains whose adjacent steps have real data-flow compatibility. Every chain must contain stable chainId and chainKey, status, steps, entrypoint, requiredCapabilities, producedCapabilities, trustBoundaryCrossings, deploymentConditions, primitiveGaps, and successTarget. chainId must be reused by Chain Review and later Exploit stages; never use id or generate a second identifier. Every referenced primitive must exist in the current scan job and every step must preserve its primitiveId. Represent unsupported bridges as primitive gaps and return a chains array. Do not claim the configured success criteria is satisfied merely because a high-impact primitive exists.

        Persist each chain directly with `research-db create-chain` or `update-chain`. For an existing chain, read its revision and submit the complete absolute chain state; on conflict, reread and merge only compatible current fields before retrying. Do not create a second chain ID for an existing `chainKey`, and do not wait for TypeScript to persist the returned array.
      prepareRepository: none
      includePolicy: false
      plugins: []
    inputSchema:
      type: object
    outputSchema:
      $ref: "#/schemas/chain-synthesis"
    inputArtifacts: []
    outputArtifacts: []
    effects: []
    containerNameParts: []
