    promptValues: {}
  chain-review:
    name: Chain Review
    description: Audit the continuity and assumptions of one exploit chain.
    role: verification
    group: research
    mode: fanout
    concurrency: 4
    disableable: true
    runtime:
      kind: agent
      persistent: false
      reuseContainer: true
      cwd: /workspace/repo
      skills:
        - research-agent
        - research-db
      prompt: |
        You are the independent Chain Review stage for exactly one exploit chain.

        Read the current chain and its referenced Finding evidence. Audit every transition, trust boundary, input/output compatibility, deployment condition, and primitive gap. Choose exactly one route decision: accepted, revise-chain, primitive-gap, or invalid-finding. When the decision is invalid-finding, set invalidFindingId to the affected Finding ID; otherwise set it to null. Treat other chains and Findings as read-only context. Do not mutate or invalidate a Finding in this stage; the downstream Finding Validation stage owns that state transition. Return only the required structured review fields. Do not create a separate review file or return a reviewPath.

        Using the research-db skill, before returning update only the current Chain with `update-chain`, using its expected revision and an absolute `status` matching the decision (`accepted`, `revise-chain`, or `primitive-gap`). On a revision conflict, reread the Chain and retry or abandon with an explicit conflict explanation. Never update another Chain or a Finding from this stage.
      prepareRepository: none
      includePolicy: false
      plugins: []
    inputSchema:
      type: object
    outputSchema:
      $ref: "#/schemas/chain-review"
    inputArtifacts: []
    outputArtifacts: []
    effects: []
    containerNameParts: []
    allowAgentExit: false
    promptValues: {}
  exploit-validation:
    name: Exploit Validation
    description: Perform source-only validation against the configured success criteria.
    role: verification
    group: research
    mode: fanout
    concurrency: 4
    disableable: true
    runtime:
      kind: agent
      persistent: false
      reuseContainer: true
      cwd: /workspace/repo
      skills:
        - research-agent
        - research-db
      prompt: |
        You are the source-only Exploit Validation stage.

        Do not execute payloads, access protected assets, alter the target project, or perform runtime exploitation. Validate the accepted chain statically against the configured attacker model and success criteria. Return the chain steps, source evidence references, execution context assumptions, failure point, successCriteriaResult=not_attempted, and verdict. Do not write a validation artifact or return a file path because the pipeline persists the complete output for downstream stages.

        After validation, use the research-db skill to read the current Chain and use `update-chain` to persist the absolute validation-relevant state that belongs to this stage, including status and evidence fields where applicable. Use the revision conflict loop; do not mark a chain confirmed solely because static validation completed.
      prepareRepository: none
      includePolicy: false
      plugins: []
    inputSchema:
      type: object
    outputSchema:
      $ref: "#/schemas/exploit-validation"
