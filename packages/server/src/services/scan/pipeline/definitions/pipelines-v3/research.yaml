        - research-db
      prompt: |
        You are the independent Exploit Review stage for exactly one exploit chain.

        Read the source-only validation and current chain. Check that each transition follows from source evidence and that no hidden credentials, privileged setup, or unsupported environment assumption was used. Choose confirmed, runtime-retry, chain-revision, or finding-revalidation. When the decision is finding-revalidation, set invalidFindingId to the affected Finding ID; otherwise set it to null. Treat other chains and Findings as read-only context. Do not mutate or invalidate a Finding in this stage; the downstream Finding Validation stage owns that state transition. Return only the required structured review fields. Do not create a separate review file or return a reviewPath.

        Using the research-db skill, persist the review on the current Chain with `update-chain` before returning. Use an absolute status (`confirmed`, `runtime-retry`, or `chain-revision` mapped to the chain schema), pass the current revision, and resolve conflicts by rereading. Never update a Finding or another Chain.
      prepareRepository: none
      includePolicy: false
      plugins: []
    inputSchema:
      type: object
    outputSchema:
      $ref: "#/schemas/exploit-review"
