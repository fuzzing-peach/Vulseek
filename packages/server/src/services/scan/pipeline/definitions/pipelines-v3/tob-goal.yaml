  goal-threat-direction:
    type: object
    description: Optional human threat direction used only as Craft context. Not a scan-job runtime input unless the UI supplies it. Focus and attackerModel are required; nonGoals and notes refine what must not be pursued.
    additionalProperties: false
    properties:
      focus:
        description: What to hunt for, in one concrete sentence. Name the asset, boundary, or vulnerability class. Do not list methods or tools.
        type: string
        minLength: 1
      attackerModel:
        description: Who the attacker is and what they may already control (network position, auth, local vs remote). Invalid capabilities belong in nonGoals, not here.
        type: string
        minLength: 1
      nonGoals:
        description: Explicit out-of-scope attacker powers, bug classes, or outcomes. Craft must merge these into GoalSpec.nonGoals.
        type: array
        items:
          type: string
      notes:
        description: Extra constraints, environment assumptions, or product context that is not itself a goal.
        type: string
    required:
      - focus
      - attackerModel
  goal-spec:
    type: object
    description: Durable hunt objective after Craft self-red-team. Defines the outcome, not the method. Hunt later activates goalPrompt as Codex /goal. Every required field must be filled; empty strings are invalid.
    additionalProperties: false
    properties:
      goalId:
        description: Stable id for this GoalSpec in the scan job. Use a short slug such as goal-1. Do not reuse ids across rewritten specs in the same job.
        type: string
        minLength: 1
      title:
        description: Short human title of the hunt objective. One line, no method names, no file lists.
        type: string
        minLength: 1
      successCriteria:
        description: Testable definition of done. A candidate counts only if it meets this. Close lazy outs here after red-team (for example "a real attacker-controlled path to the sink", not "mentioned a sink").
        type: string
        minLength: 1
      nonGoals:
        description: Invalid attacker preconditions, out-of-scope classes, and outcomes that must not be counted as success. Include merged human nonGoals when present.
        type: array
        items:
          type: string
      attackerModel:
        description: Attacker capabilities and position that Judge will enforce. Theoretical paths that need powers outside this model must be rejected.
        type: string
        minLength: 1
      stopCondition:
        description: When a single Hunt task must stop. Always one candidate that meets successCriteria, or a justified exhaustion. Never "keep looking until time runs out".
        type: string
        minLength: 1
      persistenceLanguage:
        description: Instruction Hunt must treat as standing policy. Must include that "no bugs found" is intermediate, not success, and that the agent must change method before giving up.
        type: string
        minLength: 1
      redTeamClosedLoopholes:
        description: Lazy-agent loopholes Craft found (satisfy the letter without real work) and then closed in successCriteria or nonGoals. Each item names the loophole that was closed.
        type: array
        items:
          type: string
      goalPrompt:
        description: Self-contained native-goal text later sent as Codex /goal for each Hunt. Outcome-heavy and path-light. Do not mandate a single tool. Keep under about 1800 characters. Must stand alone without the rest of this object.
        type: string
        minLength: 1
    required:
      - goalId
      - title
      - successCriteria
      - nonGoals
      - attackerModel
      - stopCondition
      - persistenceLanguage
      - redTeamClosedLoopholes
      - goalPrompt
  goal-craft-output:
    type: object
    description: Craft stage output. Write the full GoalSpec JSON to the path in goalSpecPath and also return the same object in goalSpec.
    additionalProperties: false
    properties:
      goalSpecPath:
        description: Container path of the written GoalSpec JSON file. Use /task/goal-spec.json unless a later stage requires another path.
        type: string
        minLength: 1
      goalSpec:
        description: The complete GoalSpec object, identical to the file at goalSpecPath. Must validate against the goal-spec schema.
        $ref: "#/schemas/goal-spec"
    required:
      - goalSpecPath
      - goalSpec
  hunt-goal:
    type: object
    description: One dispatchable hunt surface under the GoalSpec lens. Surface emits these; Hunt receives exactly one. Do not put a vulnerability finding here.
    additionalProperties: false
    properties:
      huntGoalId:
        description: Stable id for this hunt surface in the scan job. Unique among huntGoals emitted in this job. Example hg-auth-cookie-path.
        type: string
        minLength: 1
      title:
        description: Short name of the surface (module, flow, or boundary). Not a vulnerability title.
        type: string
        minLength: 1
      objective:
        description: What Hunt must try to prove or exhaust on this surface, in GoalSpec terms. One outcome, no tool list.
        type: string
        minLength: 1
      focusPaths:
        description: Repo-relative files or directories Hunt should stay inside. Omit or leave empty only when the surface is not path-shaped.
        type: array
        items:
          type: string
      riskPathways:
        description: Suspected source-to-sink or trust-boundary crossings to investigate. Descriptive, not confirmed findings.
        type: array
        items:
          type: string
      rationale:
        description: Why this surface is high-value for the GoalSpec versus alternatives. Used by later Surface rounds to avoid repeating dead zones.
        type: string
      partitionDimension:
        description: How this surface was sliced (module, data-flow, external-interface, privilege-boundary, and so on). Keep consistent within one Surface round.
        type: string
    required:
      - huntGoalId
      - title
      - objective
  surface-dispatch:
    type: object
    description: Surface planner output. First entry emits 2-8 diverse huntGoals. Later entries emit new huntGoals or declare global exhaustion. Surface does not hunt.
    additionalProperties: false
    properties:
      globalExhausted:
        description: True only when no useful unexplored GoalSpec-relevant surface remains. Then huntGoals must be []. False whenever this output dispatches one or more huntGoals.
        type: boolean
      exhaustionReason:
        description: Required in practice when globalExhausted is true. Summarize covered partitions, dead zones, and why another slice would not help.
        type: string
      partitionDimension:
        description: Slice axis used for the huntGoals in this dispatch (module, data-flow, interface, ...). Helps later rounds pick a different axis.
        type: string
      huntGoals:
        description: Hunt surfaces to fan out this round. Empty if and only if globalExhausted is true. First round should be 2-8 diverse items; later rounds may emit fewer.
        type: array
        items:
          $ref: "#/schemas/hunt-goal"
    required:
      - globalExhausted
      - huntGoals
  goal-candidate-finding:
    type: object
    description: Exactly one vulnerability candidate from Hunt. Must meet GoalSpec.successCriteria. Not a theoretical note. Evidence must support claim. Never emit more than one per Hunt task.
    additionalProperties: false
    properties:
      candidateId:
        description: Stable id for this candidate. Unique in the scan job. Do not reuse an id from a discarded attempt.
        type: string
        minLength: 1
      huntGoalId:
        description: The huntGoalId of the assigned surface. Must match the Hunt task input.
        type: string
        minLength: 1
      title:
        description: One-line finding title. Name the bug, not the file. Example "Unauthenticated path traversal in backup restore".
        type: string
        minLength: 1
      description:
        description: What the bug is, how it manifests, and why it matters under the GoalSpec. Concrete. No filler.
        type: string
        minLength: 1
      vulnerabilityClass:
        description: Bug class label such as path-traversal, sqli, idor, rce, authz-bypass. Prefer a conventional name over a novel phrase.
        type: string
      location:
        description: Primary code location of the sink or violated check. filePath is required; line and symbol when known.
        type: object
        additionalProperties: false
        properties:
          filePath:
            description: Repo-relative path of the primary vulnerable file.
            type: string
            minLength: 1
          line:
            description: 1-based line of the sink or missing check. Null if the issue is file-wide and no single line is honest.
            type:
              - integer
              - "null"
          symbol:
            description: Function, method, or handler name at the location. Null if unknown.
            type:
              - string
              - "null"
        required:
          - filePath
      claim:
        description: Falsifiable statement Hunt is asserting. Example "attacker-controlled filename reaches fs.readFile without sanitization in restoreBackup". Judge tests this claim.
        type: string
        minLength: 1
      rootCauseKey:
        description: Stable key for the underlying mistake, used by Dedup and Surface to avoid re-hunting the same root cause. Prefer a short slug of missing-check plus location, not the candidateId.
        type: string
        minLength: 1
      evidence:
        description: Supporting observations (code facts, traces, commands). Each item should help prove or bound the claim. Empty only if the schema still validates and the claim is fully located in location plus description.
        type: array
        items:
          type: object
      attackerControl:
        description: What the attacker actually controls to trigger the bug, consistent with GoalSpec.attackerModel.
        type: string
      preconditions:
        description: Required setup that is still allowed by the attacker model. Do not list disallowed powers; those make the candidate invalid.
        type: array
        items:
          type: string
      quickDisproofAttempt:
        description: How Hunt tried to kill the finding (wrong sink, sanitizer, auth gate). If disproof succeeded, do not emit this candidate.
        type: string
      confidence:
        description: Hunt's confidence in the claim from 0 to 1. Not a CVSS score.
        type: number
    required:
      - candidateId
      - huntGoalId
      - title
      - description
      - location
      - claim
      - rootCauseKey
  goal-exhaustion-declaration:
    type: object
    description: Hunt found no candidate that meets successCriteria after reasonable methods on this surface. "No bugs found" is not enough; methodsTried and coveredPaths must show real work.
    additionalProperties: false
    properties:
      huntGoalId:
        description: The assigned huntGoalId being declared exhausted. Must match Hunt input.
        type: string
        minLength: 1
      exhausted:
        description: Must be true. This object is only valid as an exhaustion declaration.
        type: boolean
        const: true
      methodsTried:
        description: Distinct methods actually used (manual tracing, CodeQL query X, Semgrep rule Y, ...). Name what was run, not "various tools".
        type: array
        items:
          type: string
      coveredPaths:
        description: Repo-relative files or flows inspected. Used by Surface to treat these as dead zones for this GoalSpec.
        type: array
        items:
          type: string
      reason:
        description: Why this surface is exhausted under the GoalSpec. Mention remaining uncertainty only if it cannot be reduced with another reasonable method here.
        type: string
        minLength: 1
    required:
      - huntGoalId
      - exhausted
      - methodsTried
      - coveredPaths
      - reason
  goal-hunt-output:
    type: object
    description: Hunt envelope payload. Choose exactly one outcome. candidate path fills candidate and sets exhaustion to null. exhausted path fills exhaustion and sets candidate to null. Never both, never neither.
    additionalProperties: false
    properties:
      outcome:
        description: "candidate if this Hunt emits exactly one GoalSpec-satisfying finding. exhausted if the assigned surface is done with no such finding. Must match output.json route."
        type: string
        enum:
          - candidate
          - exhausted
      candidate:
        description: The single finding when outcome is candidate. Must be null when outcome is exhausted.
        anyOf:
          - $ref: "#/schemas/goal-candidate-finding"
          - type: "null"
      exhaustion:
        description: Exhaustion record when outcome is exhausted. Must be null when outcome is candidate.
        anyOf:
          - $ref: "#/schemas/goal-exhaustion-declaration"
          - type: "null"
    required:
      - outcome
  goal-judge-verdict:
    type: object
    description: Independent Judge decision on one candidate. Checks attack-path validity under GoalSpec.attackerModel and PoC feasibility as a clear contour. Do not invent fixes. Do not re-hunt.
    additionalProperties: false
    properties:
      candidateId:
        description: Candidate being judged. Must match the input candidate id.
        type: string
        minLength: 1
      decision:
        description: "confirmed only if the attack path is valid under the attacker model and a PoC contour is feasible. rejected if the path is theoretical, needs disallowed preconditions, or the claim fails. needs-more-evidence if more work could decide; current routing treats this as rejected."
        type: string
        enum:
          - confirmed
          - rejected
          - needs-more-evidence
      summary:
        description: One-paragraph verdict. State why the path holds or fails. Do not repeat the whole candidate.
        type: string
        minLength: 1
      attackPathValid:
        description: True if source, sink, and missing check hold under GoalSpec.attackerModel. False if any required hop is missing or needs disallowed powers.
        type: boolean
      pocFeasible:
        description: True if a proof-of-concept contour is clear enough to reproduce (not necessarily a full exploit). False if the bug cannot be demonstrated even as a sketch.
        type: boolean
      reasons:
        description: Discrete supporting or rejecting reasons. Each item one fact. These are what Dedup and Surface will read.
        type: array
        items:
          type: string
    required:
      - candidateId
      - decision
      - summary
      - attackPathValid
      - pocFeasible
      - reasons
  goal-dedup-result:
    type: object
    description: Novelty check only. Do not re-judge whether the issue is a vulnerability. Compare against public issues/advisories when reachable and against prior findings in this scan job.
    additionalProperties: false
    properties:
      candidateId:
        description: Candidate being novelty-checked. Must match the input candidate id.
        type: string
        minLength: 1
      novelty:
        description: "novel if not seen before in this job or known public trackers. duplicate if it matches a prior finding or known report. known-fixed if public trackers show a fix. unknown if trackers were unreachable and no local match exists."
        type: string
        enum:
          - novel
          - duplicate
          - known-fixed
          - unknown
      summary:
        description: Why this novelty label. Cite issue/PR/advisory ids or the prior finding when relevant.
        type: string
        minLength: 1
      references:
        description: URLs or ids of matching issues, PRs, advisories, or prior findings. Empty array when none apply.
        type: array
        items:
          type: string
      judgePath:
        description: When novelty is novel, write the unchanged input.judge object to /task/outputs/judge.json and set this to that path. For every other novelty value, do not write the file and set this to null.
        type:
          - string
          - "null"
    required:
      - candidateId
      - novelty
      - summary
      - references
      - judgePath
  surface-feedback:
    type: object
    description: Downstream event fed back into Surface on re-entry. Surface uses this to avoid dead zones and already-novel root causes. Hunt and Judge do not produce this object directly; the runner maps their outputs into it.
    additionalProperties: false
    properties:
      kind:
        description: "Which event this is. hunt-candidate a Hunt finding. hunt-exhausted a surface declared done. judge-reject Judge did not confirm. dedup-reject not novel. dedup-novel confirmed and novel."
        type: string
        enum:
          - hunt-candidate
          - hunt-exhausted
          - judge-reject
          - dedup-reject
          - dedup-novel
      huntGoalId:
        description: Hunt surface this event belongs to, when known.
        type: string
      candidateId:
        description: Candidate id when this event is about a finding. Null for hunt-exhausted.
        type:
          - string
          - "null"
      summary:
        description: Short fact Surface should remember (why rejected, what was covered, which rootCauseKey is now novel).
        type: string
      payload:
        description: Extra structured context (exhaustion fields, judge reasons, rootCauseKey). Do not invent a competing schema; pass through useful fields from the upstream output.
        type: object
    required:
      - kind
      - summary
  triage-finding-stage-input:
    type: object
    required:
      - scanJob
      - repositoryPath
      - modulePath
      - functionPath
      - candidatePath
      - analysisResultPath
      - verifyResultPath
    properties:
      scanJob:
        $ref: "#/schemas/scan-job-snapshot"
      repositoryPath:
        $pathOf: "#/schemas/repository"
      modulePath:
        $pathOf: "#/schemas/module"
      functionPath:
        $pathOf: "#/schemas/target"
      candidatePath:
        $pathOf: "#/schemas/candidate"
      analysisResultPath:
        $pathOf: "#/schemas/final-analysis"
      verifyResultPath:
        $pathOf: "#/schemas/verification"
  verify-finding-stage-input:
    type: object
    required:
      - scanJob
      - repositoryPath
      - modulePath
      - functionPath
      - candidatePath
      - analysisResultPath
    properties:
      scanJob:
        $ref: "#/schemas/scan-job-snapshot"
      repositoryPath:
        $pathOf: "#/schemas/repository"
      modulePath:
        $pathOf: "#/schemas/module"
      functionPath:
        $pathOf: "#/schemas/target"
      candidatePath:
        $pathOf: "#/schemas/candidate"
      analysisResultPath:
        $pathOf: "#/schemas/final-analysis"
stages:
  goal-craft:
    name: Goal Craft
    description: Draft and self-red-team a precise GoalSpec for the configured goal.
    role: scan
    group: tob-goal
    concurrency: 1
    maxConcurrency: 1
    disableable: false
    runtime:
      kind: agent
      persistent: false
      reuseContainer: true
      cwd: /workspace/repo
      skills:
        - goal-craft
      prompt: |
        You are the Goal Craft stage for a tob-goal security scan.

        Use the repository only as needed to phrase a concrete goal.

        Produce a GoalSpec that:
        1. Centers on the configured goal and attacker model as the durable outcome.
        2. Defines precise, testable success criteria (what counts as done).
        3. Lists non-goals and invalid attacker preconditions (merge human nonGoals when present).
        4. Includes stopCondition for a single hunt task (one candidate or justified exhaustion).
        5. Injects persistence language: "no bugs found is intermediate, not success; change method before giving up."
        6. Self-red-teams the goal: list loopholes where a lazy agent could satisfy the letter without real work, then close them in successCriteria / nonGoals.
        7. Writes the full native-goal objective text into goalPrompt (outcome-heavy, path-light — do not mandate a single tool or method). This string is activated later as Codex `/goal` for each hunt, so keep it self-contained and under ~1800 characters.

        Write the GoalSpec JSON to /task/goal-spec.json and return goalSpecPath plus the goalSpec object.

        Write `/task/output.json` as:
        `{"route":null,"exit":false,"output":{"goalSpecPath":"/task/goal-spec.json","goalSpec":{...}}}`.
      prepareRepository: target
      includePolicy: true
      plugins: []
    inputSchema:
      type: object
    outputSchema:
      $ref: "#/schemas/goal-craft-output"
    inputArtifacts: []
    outputArtifacts: []
    effects: []
    taskName: Craft goal specification
    containerNameParts: []
    allowAgentExit: false
    promptValues: {}
  goal-surface:
    name: Goal Surface
    description: Goal-as-lens attack-surface planning and continuous hunt-goal dispatch.
    role: scan
    group: tob-goal
    concurrency: 1
    maxConcurrency: 1
    disableable: false
    runtime:
      kind: agent
      persistent: true
      reuseContainer: true
      cwd: /workspace/repo
      skills:
        - goal-surface
      prompt: |
        You are the Goal Surface stage for a tob-goal security scan. You are the continuous dispatcher.

        Read the GoalSpec and any feedback payload (hunt-candidate, hunt-exhausted, judge-reject, dedup-reject, dedup-novel). Use the goal as a lens over the codebase.

        On first entry: emit 2–8 diverse huntGoals (modules, data flows, or boundaries ranked by relevance to the GoalSpec). Each huntGoal needs huntGoalId, title, objective, optional focusPaths / riskPathways / partitionDimension.

        On feedback re-entry:
        - Do not repeat dead zones or already-novel root causes when avoidable.
        - Prefer emitting one or more new huntGoals to keep exploration moving.
        - When no useful unexplored goal remains, set globalExhausted=true and huntGoals=[].

        You do not perform deep vulnerability hunting yourself. You only plan and dispatch hunt goals.
        Return SurfaceDispatch JSON.

        Write `/task/output.json` as:
        `{"route":null,"exit":false,"output":{...SurfaceDispatch...}}`
        This stage has a single outbound edge — set `route` to null (do not invent a route key). When globalExhausted=true, set huntGoals to [].
      prepareRepository: none
      includePolicy: true
      plugins: []
    inputSchema:
      type: object
    outputSchema:
      $ref: "#/schemas/surface-dispatch"
    inputArtifacts: []
    outputArtifacts: []
    effects: []
    taskName: Plan hunt goals ($input.feedback.kind)
    containerNameParts: []
    allowAgentExit: false
    promptValues: {}
  goal-hunt:
    name: Goal Hunt
    description: One hunt goal, one candidate or exhaustion declaration.
    role: scan
    group: tob-goal
    concurrency: 8
    maxConcurrency: 8
    disableable: false
    goal: true
    runtime:
      kind: agent
      persistent: true
      reuseContainer: true
      cwd: /workspace/repo
      skills:
        - goal-hunt
        - codeql
        - semgrep
        - tree-sitter
      prompt: |
        You are the Goal Hunt stage for one assigned hunt goal in a tob-goal scan.

        This stage is launched as a **Codex native `/goal`**. The runtime activates thread-level goal state (`thread_goals`) with the crafted GoalSpec plus the assigned hunt surface. Work under that native objective — it survives multi-turn continuation and context compaction.

        Stay inside the assigned hunt surface. Choose any reasonable methods (manual tracing, CodeQL, Semgrep, etc.) — the goal defines the outcome, not the path.

        Stop when you have either:
        - exactly one candidate that meets the GoalSpec success criteria, or
        - a justified exhaustion with `output.exhaustion` fields (`huntGoalId`, `exhausted: true`, `methodsTried`, `coveredPaths`, `reason`).

        Never emit more than one candidate. Never claim success without evidence. "No bugs found" is not success unless you have exhausted reasonable methods for this goal.

        ## Structured JSON output requirement (mandatory)

        - Write the final result only to `/task/output.json` as a pure JSON object (no markdown fences, comments, or prose).
        - Top-level envelope must be exactly `{route, exit, output}`. Set `exit` to false.
        - `route` must be `"candidate"` or `"exhausted"` and must match the chosen path.
        - `output` must match GoalHuntOutput:
          - candidate path: `outcome: "candidate"`, populate `output.candidate` (required fields), set `output.exhaustion` to `null`
          - exhausted path: `outcome: "exhausted"`, populate `output.exhaustion` with `{huntGoalId, exhausted: true, methodsTried: string[], coveredPaths: string[], reason}`, set `output.candidate` to `null`
        - `/task/output.schema.json` is the source of truth for the complete envelope. Do not invent alternate field names. Do not add extra fields outside the schema. Use `null` for nullable fields instead of omitting them unless the schema allows omission.
        - Before ending the turn, validate with Python and the `jsonschema` package: load `/task/output.json` and `/task/output.schema.json`, validate, print only a short success/failure line. If validation fails, fix and re-validate until it passes.
        - FINAL CHECK: (1) write the complete envelope to `/task/output.json`; (2) re-open and validate against `/task/output.schema.json`; (3) only then end the turn.
      prepareRepository: none
      includePolicy: false
    inputSchema:
      type: object
    outputSchema:
      $ref: "#/schemas/goal-hunt-output"
    inputArtifacts: []
    outputArtifacts: []
    effects:
      - type: tob-goal-registry
        operation: persist-candidate
    taskName: "Hunt: $input.huntGoal.title"
    containerNameParts: []
    allowAgentExit: false
    promptValues: {}
  goal-judge:
    name: Goal Judge
    description: Single independent judge for safety path and PoC feasibility.
    role: verification
    group: tob-goal
    concurrency: 4
    maxConcurrency: 4
    disableable: false
    runtime:
      kind: agent
      persistent: false
      reuseContainer: true
      cwd: /workspace/repo
      skills:
        - goal-judge
      prompt: |
        You are the single Goal Judge for one candidate in a tob-goal scan.

        Independently verify:
        1. Attack path validity under the GoalSpec attacker model.
        2. PoC feasibility at least as a clear contour (not necessarily a full exploit).

        Decide confirmed, rejected, or needs-more-evidence. Reject theoretical paths that require disallowed preconditions. Do not invent fixes. Do not communicate with other judges.

        Return GoalJudgeVerdict JSON.

        Write `/task/output.json` as:
        `{"route":"confirmed"|"rejected","exit":false,"output":{...GoalJudgeVerdict...}}`
        Use `confirmed` only for decision=confirmed; otherwise use `rejected` (including needs-more-evidence for v1).
      prepareRepository: none
      includePolicy: true
    inputSchema:
      type: object
    outputSchema:
      $ref: "#/schemas/goal-judge-verdict"
    inputArtifacts: []
    outputArtifacts: []
    effects:
      - type: tob-goal-registry
        operation: apply-judge
    taskName: "Judge candidate: $input.candidate.title"
    containerNameParts: []
    allowAgentExit: false
    promptValues: {}
  goal-dedup:
    name: Goal Dedup
    description: Novelty check against known issues and prior scan findings.
    role: verification
    group: tob-goal
    concurrency: 4
    maxConcurrency: 4
    disableable: false
    runtime:
      kind: agent
      persistent: false
      reuseContainer: true
      cwd: /workspace/repo
      skills:
        - goal-dedup
        - search-registries
      prompt: |
        You are the Goal Dedup stage for one confirmed candidate in a tob-goal scan.

        Check novelty against GitHub issues/PRs/advisories when reachable, and against prior findings for this scan job when available. Decide novel, duplicate, known-fixed, or unknown.

        Do not re-judge whether the issue is a vulnerability. Only novelty.

        The input contains the complete Goal Judge result at `input.judge`. When the candidate is novel, preserve that judge result as a JSON artifact:

        1. Write the `input.judge` object without changing its fields to `/task/outputs/judge.json`.
        2. Set `judgePath` to `/task/outputs/judge.json` in the returned result.

        When the candidate is not novel, do not create the artifact and set `judgePath` to `null`.

        Return GoalDedupResult JSON with references when applicable.

        Write `/task/output.json` as:
        `{"route":"novel"|"reject","exit":false,"output":{...GoalDedupResult...}}`
        Use `novel` only for novelty=novel; otherwise `reject`.
      prepareRepository: none
      includePolicy: false
    inputSchema:
      type: object
    outputSchema:
      $ref: "#/schemas/goal-dedup-result"
    inputArtifacts: []
    outputArtifacts: []
    jobOutput: true
    effects:
      - type: tob-goal-registry
        operation: apply-dedup
    taskName: "Dedup candidate: $input.candidate.title"
    containerNameParts: []
    allowAgentExit: false
    promptValues: {}
edges:
  - id: goal-craft-to-goal-surface
    name: goal-craft-to-goal-surface
    from: goal-craft
    to: goal-surface
    fork: false
    mode: map
    input:
      goalSpecPath: $output.goalSpecPath
      goalSpec: $output.goalSpec
    artifacts:
      - from: $output.goalSpecPath
        to: inputs/goal-spec.json
        inputField: goalSpecPath
        required: true
  - id: goal-surface-to-goal-hunt
    name: goal-surface-to-goal-hunt
    from: goal-surface
    to: goal-hunt
    fork: false
    mode: fanOut
    foreach: $.huntGoals[*]
    input:
      goalSpecPath: $input.goalSpecPath
      goalSpec: $input.goalSpec
      huntGoal: $item
    artifacts:
      - from: $input.goalSpecPath
        to: inputs/goal-spec.json
        inputField: goalSpecPath
        required: true
  - id: goal-hunt-to-goal-judge
    name: goal-hunt-to-goal-judge
    from: goal-hunt
    to: goal-judge
    fork: false
    mode: map
    input:
      goalSpecPath: $input.goalSpecPath
      goalSpec: $input.goalSpec
      huntGoal: $input.huntGoal
      candidate: $output.candidate
    artifacts:
      - from: $input.goalSpecPath
        to: inputs/goal-spec.json
        inputField: goalSpecPath
        required: true
    route:
      key: candidate
      default: true
  - id: goal-hunt-candidate-to-goal-surface
    name: goal-hunt-candidate-to-goal-surface
    from: goal-hunt
    to: goal-surface
    fork: false
    mode: map
    input:
      goalSpecPath: $input.goalSpecPath
      goalSpec: $input.goalSpec
      feedback:
        kind: hunt-candidate
        huntGoalId: $input.huntGoal.huntGoalId
        candidateId: $output.candidate.candidateId
        summary: $output.candidate.title
        payload: $output.candidate
    artifacts:
      - from: $input.goalSpecPath
        to: inputs/goal-spec.json
        inputField: goalSpecPath
        required: true
    route:
      key: candidate
  - id: goal-hunt-exhausted-to-goal-surface
    name: goal-hunt-exhausted-to-goal-surface
    from: goal-hunt
    to: goal-surface
    fork: false
    mode: map
    input:
      goalSpecPath: $input.goalSpecPath
      goalSpec: $input.goalSpec
      feedback:
        kind: hunt-exhausted
        huntGoalId: $input.huntGoal.huntGoalId
        candidateId: null
        summary: $output.exhaustion.reason
        payload: $output.exhaustion
    artifacts:
      - from: $input.goalSpecPath
        to: inputs/goal-spec.json
        inputField: goalSpecPath
        required: true
    route:
      key: exhausted
  - id: goal-judge-to-goal-dedup
    name: goal-judge-to-goal-dedup
    from: goal-judge
    to: goal-dedup
    fork: false
    mode: map
    input:
      goalSpecPath: $input.goalSpecPath
      goalSpec: $input.goalSpec
      huntGoal: $input.huntGoal
      candidate: $input.candidate
      judge: $output
    artifacts:
      - from: $input.goalSpecPath
        to: inputs/goal-spec.json
        inputField: goalSpecPath
        required: true
    route:
      key: confirmed
  - id: goal-judge-reject-to-goal-surface
    name: goal-judge-reject-to-goal-surface
    from: goal-judge
    to: goal-surface
    fork: false
    mode: map
    input:
      goalSpecPath: $input.goalSpecPath
      goalSpec: $input.goalSpec
      feedback:
        kind: judge-reject
        huntGoalId: $input.huntGoal.huntGoalId
        candidateId: $input.candidate.candidateId
        summary: $output.summary
        payload: $output
    artifacts:
      - from: $input.goalSpecPath
        to: inputs/goal-spec.json
        inputField: goalSpecPath
        required: true
    route:
      key: rejected
      default: true
  - id: goal-dedup-novel-to-goal-surface
    name: goal-dedup-novel-to-goal-surface
    from: goal-dedup
    to: goal-surface
    fork: false
    mode: map
    input:
      goalSpecPath: $input.goalSpecPath
      goalSpec: $input.goalSpec
      feedback:
        kind: dedup-novel
        huntGoalId: $input.huntGoal.huntGoalId
        candidateId: $input.candidate.candidateId
        summary: $output.summary
        payload: $output
    artifacts:
      - from: $input.goalSpecPath
        to: inputs/goal-spec.json
        inputField: goalSpecPath
        required: true
    route:
      key: novel
  - id: goal-dedup-reject-to-goal-surface
    name: goal-dedup-reject-to-goal-surface
    from: goal-dedup
    to: goal-surface
    fork: false
    mode: map
    input:
      goalSpecPath: $input.goalSpecPath
      goalSpec: $input.goalSpec
      feedback:
        kind: dedup-reject
        huntGoalId: $input.huntGoal.huntGoalId
        candidateId: $input.candidate.candidateId
        summary: $output.summary
        payload: $output
    artifacts:
      - from: $input.goalSpecPath
        to: inputs/goal-spec.json
        inputField: goalSpecPath
        required: true
    route:
      key: reject
      default: true
groups: []
