version: 3
name: tob-goal-programmatic
supportedTargets:
  - project
  - evaluation
root: goal-craft
limits:
  maxTasks: 10000
  maxDurationSeconds: 86400
schemas:
  analyze-finding-stage-input:
    type: object
    required:
      - scanJob
      - repositoryPath
      - modulePath
      - functionPath
      - candidatePath
    properties:
      scanJob:
        $ref: "#/schemas/scan-job-snapshot"
      repositoryPath:
        $pathOf: "#/schemas/repository"
      modulePath:
        $pathOf: "#/schemas/module"
      functionPath:
        $pathOf: "#/schemas/target"
      candidatePath:
        $pathOf: "#/schemas/candidate"
      analysisReportTemplatePath:
        type:
          - string
          - "null"
      feedbackPath:
        type:
          - string
          - "null"
  attack-surface-model-stage-input:
    type: object
    required:
      - scanJob
      - repositoryPath
      - modulePath
      - moduleId
      - moduleName
      - priority
    properties:
      scanJob:
        $ref: "#/schemas/scan-job-snapshot"
      repositoryPath:
        $pathOf: "#/schemas/repository"
      modulePath:
        $pathOf: "#/schemas/module"
      moduleId:
        type: string
      moduleName:
        type: string
      priority:
        type:
          - integer
          - "null"
  module-threat-model-manifest:
    type: object
    required:
      - repository
      - module
      - threatModel
    additionalProperties: false
    properties:
      repository:
        $pathOf: "#/schemas/repository"
      module:
        $pathOf: "#/schemas/module"
      threatModel:
        $pathOf: "#/schemas/module-threat-model"
  critique-finding-stage-input:
    allOf:
      - $ref: "#/schemas/analyze-finding-stage-input"
      - type: object
        required:
          - draftAnalysisPath
          - analysisFingerprint
        properties:
          draftAnalysisPath:
            $pathOf: "#/schemas/analysis"
          analysisFingerprint:
            type: string
  null-stage-input:
    type: "null"
  delta-scope-manifest:
    type: object
    required:
      - repository
      - module
      - threatModel
      - functions
    additionalProperties: false
    properties:
      repository:
        $pathOf: "#/schemas/repository"
      module:
        $pathOf: "#/schemas/module"
      threatModel:
        $pathOf: "#/schemas/module-threat-model"
      functions:
        type: array
        items:
          $pathOf: "#/schemas/target"
  identify-target-stage-input:
    type: object
    required:
      - scanJob
      - repositoryPath
      - modulePath
      - threatModelPath
      - moduleId
      - moduleName
      - priority
      - vulnerabilityClassFocus
    properties:
      scanJob:
        $ref: "#/schemas/scan-job-snapshot"
      repositoryPath:
        $pathOf: "#/schemas/repository"
      modulePath:
        $pathOf: "#/schemas/module"
      threatModelPath:
        $pathOf: "#/schemas/module-threat-model"
      moduleId:
        type: string
      moduleName:
        type: string
      priority:
        type:
          - integer
          - "null"
      vulnerabilityClassFocus:
        type: string
  identify-target-manifest:
    type: object
    required:
      - repository
      - module
      - threatModel
      - targets
    additionalProperties: false
    properties:
      repository:
        $pathOf: "#/schemas/repository"
      module:
        $pathOf: "#/schemas/module"
      threatModel:
        $pathOf: "#/schemas/module-threat-model"
      targets:
        type: array
        items:
          $pathOf: "#/schemas/target"
  repository-profile-manifest:
    type: object
    required:
      - repository
      - modules
    properties:
      repository:
        $pathOf: "#/schemas/repository"
      modules:
        type: array
        items:
          $pathOf: "#/schemas/module"
  research-scope-stage-input:
    type: object
    additionalProperties: false
    properties: {}
    required: []
  research-scope:
    type: object
    additionalProperties: false
    properties:
      attackerModel:
        type: object
      trustedDomain:
        type: object
      protectedAssets:
        type: array
        items:
          type: string
      deploymentAssumptions:
        type: array
        items:
          type: string
      rulesOfEngagement:
        type: array
        items:
          type: string
      minimumResearchDeadlineAt:
        type: string
      successCriteria:
        type: object
    required:
      - attackerModel
      - trustedDomain
      - protectedAssets
      - deploymentAssumptions
      - rulesOfEngagement
      - minimumResearchDeadlineAt
      - successCriteria
  scope-manifest:
    type: object
    additionalProperties: false
    properties:
      scopePath:
        type: string
    required:
      - scopePath
  surface-map:
    type: object
    additionalProperties: false
    properties:
      entrypoints:
        type: array
        items:
          type: object
      trustBoundaries:
        type: array
        items:
          type: object
      sources:
        type: array
        items:
          type: object
      sinks:
        type: array
        items:
          type: object
      components:
        type: array
        items:
          type: object
      dependencyFlows:
        type: array
        items:
          type: object
      coverage:
        type: object
      openQuestions:
        type: array
        items:
          type: string
    required:
      - entrypoints
      - trustBoundaries
      - sources
      - sinks
      - components
      - dependencyFlows
      - coverage
      - openQuestions
  surface-map-manifest:
    type: object
    additionalProperties: false
    properties:
      surfaceMapPath:
        type: string
    required:
      - surfaceMapPath
  track-plan:
    type: object
    additionalProperties: false
    properties:
      tracks:
        type: array
        items:
          $ref: "#/schemas/research-track"
      iteration:
        type: integer
    required:
      - tracks
      - iteration
  research-track:
    type: object
    additionalProperties: false
    properties:
      trackKey:
        type: string
        minLength: 1
      approachFamily:
        type: string
        minLength: 1
      researchIdea:
        type: string
        minLength: 1
      scope:
        type: object
      mechanisms:
        type: array
        items:
          type: string
      coverage:
        type: object
      evidenceRefs:
        type: array
        items:
          type: string
      findingIds:
        type: array
        items:
          type: string
      nextStep:
        type: string
      status:
        type: string
        enum:
          - queued
          - active
          - blocked
          - exhausted
    required:
      - trackKey
      - approachFamily
      - researchIdea
      - scope
      - mechanisms
  research-track-reference:
    type: object
    additionalProperties: false
    properties:
      trackKey:
        type: string
        minLength: 1
      approachFamily:
        type: string
        minLength: 1
      researchIdea:
        type: string
        minLength: 1
      scope:
        type: object
      mechanisms:
        type: array
        items:
          type: string
      coverage:
        type: object
      evidenceRefs:
        type: array
        items:
          type: string
      findingIds:
        type: array
        items:
          type: string
      nextStep:
        type: string
    required:
      - trackKey
  finding:
    type: object
    additionalProperties: false
    properties:
      findingId:
        type: string
        minLength: 1
      trackKey:
        type: string
        minLength: 1
      title:
        type: string
        minLength: 1
      description:
        type: string
        minLength: 1
      vulnerabilityClass:
        type:
          - string
          - "null"
      location:
        type: object
        additionalProperties: false
        properties:
          filePath:
            type: string
            minLength: 1
          line:
            type:
              - integer
              - "null"
          symbol:
            type:
              - string
              - "null"
        required:
          - filePath
          - line
          - symbol
      claim:
        type: string
        minLength: 1
      rootCauseKey:
        type: string
        minLength: 1
      source:
        type: object
      sink:
        type: object
      attackerControl:
        type: string
        minLength: 1
      trustBoundaryCrossings:
        type: array
        items:
          type: object
      preconditions:
        type: array
        items:
          type: string
      evidence:
        type: array
        items:
          type: object
          additionalProperties: false
          properties:
            id:
              type: string
              minLength: 1
            kind:
              type: string
              minLength: 1
            summary:
              type: string
              minLength: 1
            filePath:
              type:
                - string
                - "null"
            line:
              type:
                - integer
                - "null"
            symbol:
              type:
                - string
                - "null"
            observation:
              type: string
              minLength: 1
            supports:
              type: array
              items:
                type: string
            contradicts:
              type: array
              items:
                type: string
          required:
            - id
            - kind
            - summary
            - filePath
            - line
            - symbol
            - observation
            - supports
            - contradicts
      quickDisproofAttempt:
        type: string
        minLength: 1
      confidence:
        type: number
        minimum: 0
        maximum: 1
    required:
      - findingId
      - trackKey
      - title
      - description
      - vulnerabilityClass
      - location
      - claim
      - rootCauseKey
      - source
      - sink
      - attackerControl
      - trustBoundaryCrossings
      - preconditions
      - evidence
      - quickDisproofAttempt
      - confidence
  discovery-report:
    type: object
    additionalProperties: false
    properties:
      trackId:
        type: string
      source:
        type: object
      transformations:
        type: array
        items:
          type: object
      guards:
        type: array
        items:
          type: object
      sink:
        type: object
      reachability:
        type: object
      attackerControl:
        type: object
      preconditions:
        type: array
        items:
          type: string
      findingPaths:
        type: array
        items:
          $pathOf: "#/schemas/finding"
      quickDisproofAttempt:
        type: object
      newTrackSuggestions:
        type: array
        items:
          type: object
    required:
      - trackId
      - source
      - transformations
      - guards
      - sink
      - reachability
      - attackerControl
      - preconditions
      - findingPaths
      - quickDisproofAttempt
      - newTrackSuggestions
  discovery-manifest:
    type: object
    additionalProperties: false
    properties:
      trackId:
        type: string
      discoveryReportPath:
        $pathOf: "#/schemas/discovery-report"
    required:
      - trackId
      - discoveryReportPath
  track-review:
    type: object
    additionalProperties: false
    properties:
      trackKey:
        type: string
        minLength: 1
      decision:
        type: string
        enum:
          - continue
          - finding-found
          - new-surface
          - blocked
          - exhausted
      summary:
        type: string
        minLength: 1
      findingIds:
        type: array
        items:
          type: string
      coverageGaps:
        type: array
        items:
          type: string
      nextStep:
        anyOf:
          - type: string
            minLength: 1
          - type: "null"
      blockReason:
        anyOf:
          - type: string
            minLength: 1
          - type: "null"
      reopenCondition:
        anyOf:
          - type: string
            minLength: 1
          - type: "null"
    required:
      - trackKey
      - decision
      - summary
      - findingIds
      - coverageGaps
      - nextStep
      - blockReason
      - reopenCondition
  finding-validation:
    type: object
    additionalProperties: false
    properties:
      findingId:
        type: string
      reachability:
        type: object
      controllability:
        type: object
      trustBoundaryCrossings:
        type: array
        items:
          type: object
      guardAnalysis:
        type: object
      deploymentConditions:
        type: array
        items:
          type: string
      primitive:
        anyOf:
          - $ref: "#/schemas/research-primitive"
          - type: object
            additionalProperties: false
            properties: {}
      evidenceRefs:
        type: array
        items:
          type: string
      disproofResult:
        type: object
      verdict:
        type: string
    required:
      - findingId
      - reachability
      - controllability
      - trustBoundaryCrossings
      - guardAnalysis
      - deploymentConditions
      - primitive
      - evidenceRefs
      - disproofResult
      - verdict
  finding-review:
    type: object
    additionalProperties: false
    properties:
      findingId:
        type: string
      decision:
        type: string
        enum:
          - confirmed
          - needs-more-evidence
          - false-positive
      summary:
        type: string
      challenges:
        type: array
        items:
          type: object
      requiredEvidence:
        type: array
        items:
          type: string
      confirmedPrimitive:
        anyOf:
          - $ref: "#/schemas/research-primitive"
          - type: object
            additionalProperties: false
            properties: {}
    required:
      - findingId
      - decision
      - summary
      - challenges
      - requiredEvidence
      - confirmedPrimitive
  research-primitive:
    type: object
    additionalProperties: false
    properties:
      primitiveId:
        type: string
        minLength: 1
      name:
        type: string
        minLength: 1
      capability:
        type: string
        minLength: 1
      requiredInput:
        type: object
      producedCapability:
        type: object
      trustLevel:
        type: string
        minLength: 1
      evidenceRefs:
        type: array
        items:
          type: string
    required:
      - primitiveId
      - name
      - capability
      - requiredInput
      - producedCapability
      - trustLevel
      - evidenceRefs
  chain-synthesis:
    type: object
    additionalProperties: false
    properties:
      chains:
        type: array
        items:
          $ref: "#/schemas/research-chain"
    required:
      - chains
  research-chain:
    type: object
    additionalProperties: false
    properties:
      chainId:
        type: string
        minLength: 1
      chainKey:
        type: string
        minLength: 1
      status:
        type: string
        enum:
          - candidate
          - incomplete
          - accepted
          - confirmed
          - primitive-gap
          - revise-chain
      steps:
        type: array
        minItems: 1
        items:
          $ref: "#/schemas/research-chain-step"
      entrypoint:
        type: object
      requiredCapabilities:
        type: array
        items:
          type: string
      producedCapabilities:
        type: array
        items:
          type: string
      trustBoundaryCrossings:
        type: array
        items:
          type: object
      deploymentConditions:
        type: array
        items:
          type: string
      primitiveGaps:
        type: array
        items:
          type: object
      successTarget:
        type: object
    required:
      - chainId
      - chainKey
      - status
      - steps
      - entrypoint
      - requiredCapabilities
      - producedCapabilities
      - trustBoundaryCrossings
      - deploymentConditions
      - primitiveGaps
      - successTarget
  research-chain-step:
    type: object
    additionalProperties: false
    properties:
      primitiveId:
        type: string
        minLength: 1
      findingId:
        type: string
        minLength: 1
      entrypoint:
        type: object
      requiredCapabilities:
        type: array
        items:
          type: string
      producedCapabilities:
        type: array
        items:
          type: string
      trustBoundaryCrossings:
        type: array
        items:
          type: object
      deploymentConditions:
        type: array
        items:
          type: string
    required:
      - primitiveId
  chain-review:
    type: object
    additionalProperties: false
    properties:
      chainId:
        type: string
        minLength: 1
      decision:
        type: string
        enum:
          - accepted
          - revise-chain
          - primitive-gap
          - invalid-finding
      brokenTransitions:
        type: array
        items:
          type: object
      invalidatedFindings:
        type: array
        items:
          type: string
      invalidFindingId:
        type:
          - string
          - "null"
      requiredRevisions:
        type: array
        items:
          type: string
    required:
      - chainId
      - decision
      - brokenTransitions
      - invalidatedFindings
      - invalidFindingId
      - requiredRevisions
  exploit-validation:
    type: object
    additionalProperties: false
    properties:
      chainId:
        type: string
        minLength: 1
      steps:
        type: array
        items:
          type: object
      evidenceRefs:
        type: array
        items:
          type: string
      executionContext:
        type: object
      failurePoint:
        type:
          - object
          - "null"
      successCriteriaResult:
        type: string
        enum:
          - not_attempted
          - satisfied
          - not_satisfied
          - inconclusive
      verdict:
        type: string
    required:
      - chainId
      - steps
      - evidenceRefs
      - executionContext
      - failurePoint
      - successCriteriaResult
      - verdict
  exploit-review:
    type: object
    additionalProperties: false
    properties:
      chainId:
        type: string
        minLength: 1
      decision:
        type: string
        enum:
          - confirmed
          - runtime-retry
          - chain-revision
          - finding-revalidation
      reproducibility:
        type: object
      environmentAssumptions:
        type: array
        items:
          type: string
      invalidatedSteps:
        type: array
        items:
          type: object
      invalidFindingId:
        type:
          - string
          - "null"
    required:
      - chainId
      - decision
      - reproducibility
      - environmentAssumptions
      - invalidatedSteps
      - invalidFindingId
  research-report:
    type: object
    additionalProperties: false
    properties:
      chainId:
        type: string
      reportPath:
        type: string
      verdict:
        type: string
    required:
      - chainId
      - reportPath
      - verdict
  scan-target-stage-input:
    type: object
    required:
      - scanJob
      - repositoryPath
      - modulePath
      - threatModelPath
      - targetPath
      - moduleId
      - moduleName
      - targetId
      - targetName
      - targetKind
      - priority
      - vulnerabilityClassFocus
    properties:
      scanJob:
        $ref: "#/schemas/scan-job-snapshot"
      repositoryPath:
        $pathOf: "#/schemas/repository"
      modulePath:
        $pathOf: "#/schemas/module"
      threatModelPath:
        $pathOf: "#/schemas/module-threat-model"
      targetPath:
        $pathOf: "#/schemas/target"
      moduleId:
        type: string
      moduleName:
        type: string
      targetId:
        type: string
      targetName:
        type: string
      targetKind:
        type: string
      filePath:
        type:
          - string
          - "null"
      line:
        type:
          - integer
          - "null"
      summary:
        type:
          - string
          - "null"
      priority:
        type:
          - integer
          - "null"
      vulnerabilityClassFocus:
        type: string
  scan-target-manifest:
    type: object
    required:
      - candidates
    properties:
      candidates:
        type: array
        items:
          $pathOf: "#/schemas/candidate"
  scan-job-snapshot:
    type: object
    required:
      - scanJobId
    additionalProperties: true
    properties:
      scanJobId:
        type: string
  evidence:
    type: object
    required:
      - id
      - kind
      - summary
      - filePath
      - line
      - symbol
      - command
      - artifactPath
      - observation
      - supports
      - contradicts
      - confidenceImpact
    additionalProperties: false
    properties:
      id:
        type: string
      kind:
        enum:
          - code
          - runtime
          - fuzz
          - negative
          - assumption
          - external
      summary:
        type: string
      filePath:
        type:
          - string
          - "null"
      line:
        type:
          - integer
          - "null"
      symbol:
        type:
          - string
          - "null"
      command:
        type:
          - string
          - "null"
      artifactPath:
        type:
          - string
          - "null"
      observation:
        type:
          - string
          - "null"
      supports:
        type: array
        items:
          type: string
      contradicts:
        type: array
        items:
          type: string
      confidenceImpact:
        type:
          - string
          - "null"
  repository:
    type: object
    required:
      - id
      - name
      - summary
      - languages
      - buildSystems
      - runtimeDirectories
      - downrankedDirectories
      - notes
      - targetRef
      - targetTag
      - commitSha
      - baseSha
      - commitWindow
    properties:
      id:
        type: string
      name:
        type: string
      summary:
        type: string
      languages:
        type: array
        items:
          type: string
      buildSystems:
        type: array
        items:
          type: string
      runtimeDirectories:
        type: array
        items:
          type: string
      downrankedDirectories:
        type: array
        items:
          type: string
      notes:
        type: array
        items:
          type: string
      targetRef:
        type:
          - string
          - "null"
      targetTag:
        type:
          - string
          - "null"
      commitSha:
        type:
          - string
          - "null"
      baseSha:
        type:
          - string
          - "null"
      commitWindow:
        type: integer
  module:
    type: object
    required:
      - id
      - moduleId
      - name
      - summary
      - priority
      - files
      - entryPoints
      - trustBoundaries
      - attackSurfaces
      - vulnerabilityThemes
      - runtimeComponents
      - notes
    additionalProperties: false
    properties:
      id:
        type: string
      moduleId:
        type: string
      name:
        type: string
      summary:
        type: string
      priority:
        type: integer
      files:
        type: array
        items:
          type: string
      entryPoints:
        type: array
        items:
          type: string
      trustBoundaries:
        type: array
        items:
          type: string
      attackSurfaces:
        type: array
        items:
          type: string
      vulnerabilityThemes:
        type: array
        items:
          type: string
      runtimeComponents:
        type: array
        items:
          type: string
      notes:
        type: array
        items:
          type: string
  function:
    type: object
    required:
      - id
      - moduleId
      - moduleName
      - functionId
      - functionName
      - filePath
      - line
      - priority
      - summary
      - vulnerabilityType
      - score
      - role
      - reachability
      - sourceToSinkHint
      - excludeReason
      - priorityReason
      - securityModelRelation
      - attackSurface
      - trustBoundary
      - likelyVulnerabilityTypes
    properties:
      id:
        type: string
      moduleId:
        type: string
      moduleName:
        type: string
      functionId:
        type: string
      functionName:
        type: string
      filePath:
        type:
          - string
          - "null"
      line:
        type:
          - integer
          - "null"
      priority:
        type: integer
      summary:
        type:
          - string
          - "null"
      vulnerabilityType:
        type:
          - string
          - "null"
      score:
        type:
          - number
          - "null"
      role:
        type: string
      reachability:
        type: string
      sourceToSinkHint:
        type:
          - string
          - "null"
      excludeReason:
        type:
          - string
          - "null"
      priorityReason:
        type: string
      securityModelRelation:
        type: string
      attackSurface:
        type:
          - string
          - "null"
      trustBoundary:
        type:
          - string
          - "null"
      likelyVulnerabilityTypes:
        type: array
        items:
          type: string
  target-kind:
    enum:
      - function
      - route-handler
      - middleware
      - api-route
      - server-action
      - page-loader
      - controller-action
      - view-function
      - resolver
      - job-handler
      - cli-command
      - security-config
      - template-render
      - parser-deserializer
      - data-access
      - unknown
  target:
    type: object
    required:
      - id
      - moduleId
      - moduleName
      - targetId
      - targetName
      - targetKind
      - language
      - framework
      - sourceFiles
      - filePath
      - line
      - routePath
