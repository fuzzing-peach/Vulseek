stages:
  goal-craft:
    name: Goal Craft
    description: Draft and self-red-team a precise GoalSpec from the human threat direction.
    role: scan
    group: tob-goal
    mode: serial
    concurrency: 1
    maxConcurrency: 1
    disableable: false
    runtime:
      kind: agent
      persistent: false
      reuseContainer: true
      cwd: /workspace/repo
      skills:
        - goal-craft
      prompt: |
        You are the Goal Craft stage for a tob-goal security scan.

        **Mandatory:** Read `threatDirection` from task input (`focus`, `attackerModel`, `nonGoals`, `notes`). The human focus is the primary outcome — do not broaden it into a generic "untrusted input" hunt, and do not invent a weaker or different impact class than the human asked for. If notes are present, fold them into constraints.

        Use the repository only as needed to phrase a concrete goal.

        Produce a GoalSpec that:
        1. Centers on threatDirection.focus (and attackerModel) as the durable outcome.
        2. Defines precise, testable success criteria (what counts as done).
        3. Lists non-goals and invalid attacker preconditions (merge human nonGoals when present).
        4. Includes stopCondition for a single hunt task (one candidate or justified exhaustion).
        5. Injects persistence language: "no bugs found is intermediate, not success; change method before giving up."
        6. Self-red-teams the goal: list loopholes where a lazy agent could satisfy the letter without real work, then close them in successCriteria / nonGoals.
        7. Writes the full native-goal objective text into goalPrompt (outcome-heavy, path-light — do not mandate a single tool or method). This string is activated later as Codex `/goal` for each hunt, so keep it self-contained and under ~1800 characters.

        Write the GoalSpec JSON to /task/goal-spec.json and return goalSpecPath plus the goalSpec object.

        Write `/task/output.json` as:
        `{"route":null,"exit":false,"output":{"goalSpecPath":"/task/goal-spec.json","goalSpec":{...}}}`.
      prepareRepository: target
      includePolicy: true
      plugins: []
    inputSchema:
      type: object
    outputSchema:
      $ref: "#/schemas/goal-craft-output"
    inputArtifacts: []
    outputArtifacts: []
    effects: []
    taskName: Craft goal specification
    containerNameParts: []
    allowAgentExit: false
    promptValues: {}
  goal-surface:
    name: Goal Surface
    description: Goal-as-lens attack-surface planning and continuous hunt-goal dispatch.
    role: scan
    group: tob-goal
    mode: serial
    concurrency: 1
    maxConcurrency: 1
    disableable: false
    runtime:
      kind: agent
      persistent: true
      reuseContainer: true
      cwd: /workspace/repo
      skills:
        - goal-surface
      prompt: |
        You are the Goal Surface stage for a tob-goal security scan. You are the continuous dispatcher.

        Read the GoalSpec and any feedback payload (hunt-candidate, hunt-exhausted, judge-reject, dedup-reject, dedup-novel). Use the goal as a lens over the codebase.

        On first entry: emit 2–8 diverse huntGoals (modules, data flows, or boundaries ranked by relevance to the GoalSpec). Each huntGoal needs huntGoalId, title, objective, optional focusPaths / riskPathways / partitionDimension.

        On feedback re-entry:
        - Do not repeat dead zones or already-novel root causes when avoidable.
        - Prefer emitting one or more new huntGoals to keep exploration moving.
        - When no useful unexplored goal remains, set globalExhausted=true and huntGoals=[].

        You do not perform deep vulnerability hunting yourself. You only plan and dispatch hunt goals.
        Return SurfaceDispatch JSON.

        Write `/task/output.json` as:
        `{"route":null,"exit":false,"output":{...SurfaceDispatch...}}`
        This stage has a single outbound edge — set `route` to null (do not invent a route key). When globalExhausted=true, set huntGoals to [].
      prepareRepository: none
      includePolicy: true
      plugins: []
    inputSchema:
      type: object
    outputSchema:
      $ref: "#/schemas/surface-dispatch"
    inputArtifacts: []
    outputArtifacts: []
    effects: []
    taskName: Plan hunt goals ($input.feedback.kind)
    containerNameParts: []
    allowAgentExit: false
    promptValues: {}
  goal-hunt:
    name: Goal Hunt
    description: One hunt goal, one candidate or exhaustion declaration.
    role: scan
    group: tob-goal
    mode: fanout
    concurrency: 8
    maxConcurrency: 8
    disableable: false
    runtime:
      kind: agent
      persistent: true
      reuseContainer: true
      cwd: /workspace/repo
      skills:
        - goal-hunt
        - codeql
        - semgrep
        - tree-sitter
      prompt: |
        You are the Goal Hunt stage for one assigned hunt goal in a tob-goal scan.

        This stage is launched as a **Codex native `/goal`**. The runtime activates thread-level goal state (`thread_goals`) with the crafted GoalSpec plus the assigned hunt surface. Work under that native objective — it survives multi-turn continuation and context compaction.

        Stay inside the assigned hunt surface. Choose any reasonable methods (manual tracing, CodeQL, Semgrep, etc.) — the goal defines the outcome, not the path.

        Stop when you have either:
        - exactly one candidate that meets the GoalSpec success criteria, or
        - a justified exhaustion with `output.exhaustion` fields (`huntGoalId`, `exhausted: true`, `methodsTried`, `coveredPaths`, `reason`).

        Never emit more than one candidate. Never claim success without evidence. "No bugs found" is not success unless you have exhausted reasonable methods for this goal.

        ## Structured JSON output requirement (mandatory)

        - Write the final result only to `/task/output.json` as a pure JSON object (no markdown fences, comments, or prose).
        - Top-level envelope must be exactly `{route, exit, output}`. Set `exit` to false.
        - `route` must be `"candidate"` or `"exhausted"` and must match the chosen path.
        - `output` must match GoalHuntOutput:
          - candidate path: `outcome: "candidate"`, populate `output.candidate` (required fields), set `output.exhaustion` to `null`
          - exhausted path: `outcome: "exhausted"`, populate `output.exhaustion` with `{huntGoalId, exhausted: true, methodsTried: string[], coveredPaths: string[], reason}`, set `output.candidate` to `null`
        - `/task/output.schema.json` is the source of truth for the complete envelope. Do not invent alternate field names. Do not add extra fields outside the schema. Use `null` for nullable fields instead of omitting them unless the schema allows omission.
        - Before ending the turn, validate with Python and the `jsonschema` package: load `/task/output.json` and `/task/output.schema.json`, validate, print only a short success/failure line. If validation fails, fix and re-validate until it passes.
        - FINAL CHECK: (1) write the complete envelope to `/task/output.json`; (2) re-open and validate against `/task/output.schema.json`; (3) only then end the turn.
      prepareRepository: none
      includePolicy: false
      plugins:
        - tob-goal-native
    inputSchema:
      type: object
    outputSchema:
      $ref: "#/schemas/goal-hunt-output"
    inputArtifacts: []
    outputArtifacts: []
    effects:
      - type: tob-goal-registry
        operation: persist-candidate
    taskName: "Hunt: $input.huntGoal.title"
    containerNameParts: []
    allowAgentExit: false
    promptValues: {}
  goal-judge:
    name: Goal Judge
    description: Single independent judge for safety path and PoC feasibility.
    role: verification
    group: tob-goal
    mode: fanout
    concurrency: 4
    maxConcurrency: 4
    disableable: false
    runtime:
      kind: agent
      persistent: false
      reuseContainer: true
      cwd: /workspace/repo
      skills:
        - goal-judge
      prompt: |
        You are the single Goal Judge for one candidate in a tob-goal scan.

        Independently verify:
        1. Attack path validity under the GoalSpec attacker model.
        2. PoC feasibility at least as a clear contour (not necessarily a full exploit).

        Decide confirmed, rejected, or needs-more-evidence. Reject theoretical paths that require disallowed preconditions. Do not invent fixes. Do not communicate with other judges.

        Return GoalJudgeVerdict JSON.

        Write `/task/output.json` as:
        `{"route":"confirmed"|"rejected","exit":false,"output":{...GoalJudgeVerdict...}}`
        Use `confirmed` only for decision=confirmed; otherwise use `rejected` (including needs-more-evidence for v1).
      prepareRepository: none
      includePolicy: true
      plugins:
        - tob-goal-native
    inputSchema:
      type: object
    outputSchema:
      $ref: "#/schemas/goal-judge-verdict"
    inputArtifacts: []
    outputArtifacts: []
    effects:
      - type: tob-goal-registry
        operation: apply-judge
    taskName: "Judge candidate: $input.candidate.title"
    containerNameParts: []
    allowAgentExit: false
    promptValues: {}
  goal-dedup:
    name: Goal Dedup
    description: Novelty check against known issues and prior scan findings.
    role: verification
    group: tob-goal
    mode: fanout
    concurrency: 4
    maxConcurrency: 4
    disableable: false
    runtime:
      kind: agent
      persistent: false
      reuseContainer: true
      cwd: /workspace/repo
      skills:
        - goal-dedup
        - search-registries
      prompt: |
        You are the Goal Dedup stage for one confirmed candidate in a tob-goal scan.

        Check novelty against GitHub issues/PRs/advisories when reachable, and against prior findings for this scan job when available. Decide novel, duplicate, known-fixed, or unknown.

        Do not re-judge whether the issue is a vulnerability. Only novelty.

        Return GoalDedupResult JSON with references when applicable.

        Write `/task/output.json` as:
        `{"route":"novel"|"reject","exit":false,"output":{...GoalDedupResult...}}`
        Use `novel` only for novelty=novel; otherwise `reject`.
      prepareRepository: none
      includePolicy: false
      plugins:
        - tob-goal-native
    inputSchema:
      type: object
    outputSchema:
      $ref: "#/schemas/goal-dedup-result"
    inputArtifacts: []
    outputArtifacts: []
    effects:
      - type: tob-goal-registry
        operation: apply-dedup
    taskName: "Dedup candidate: $input.candidate.title"
    containerNameParts: []
    allowAgentExit: false
    promptValues: {}
edges:
  - id: goal-craft-to-goal-surface
    name: goal-craft-to-goal-surface
    from: goal-craft
    to: goal-surface
    fork: false
    mode: map
    input:
      goalSpecPath: $output.goalSpecPath
      goalSpec: $output.goalSpec
    artifacts:
      - from: $output.goalSpecPath
        to: inputs/goal-spec.json
        inputField: goalSpecPath
        required: true
  - id: goal-surface-to-goal-hunt
    name: goal-surface-to-goal-hunt
    from: goal-surface
    to: goal-hunt
    fork: false
    mode: fanOut
    foreach: $.huntGoals[*]
    input:
      goalSpecPath: $input.goalSpecPath
      goalSpec: $input.goalSpec
      huntGoal: $item
    artifacts:
      - from: $input.goalSpecPath
        to: inputs/goal-spec.json
        inputField: goalSpecPath
        required: true
  - id: goal-hunt-to-goal-judge
    name: goal-hunt-to-goal-judge
    from: goal-hunt
    to: goal-judge
    fork: false
    mode: map
    input:
      goalSpecPath: $input.goalSpecPath
      goalSpec: $input.goalSpec
      huntGoal: $input.huntGoal
      candidate: $output.candidate
    artifacts:
      - from: $input.goalSpecPath
        to: inputs/goal-spec.json
        inputField: goalSpecPath
        required: true
    route:
      key: candidate
      default: true
  - id: goal-hunt-candidate-to-goal-surface
    name: goal-hunt-candidate-to-goal-surface
    from: goal-hunt
    to: goal-surface
    fork: false
    mode: map
    input:
      goalSpecPath: $input.goalSpecPath
      goalSpec: $input.goalSpec
      feedback:
        kind: hunt-candidate
        huntGoalId: $input.huntGoal.huntGoalId
        candidateId: $output.candidate.candidateId
        summary: $output.candidate.title
        payload: $output.candidate
    artifacts:
      - from: $input.goalSpecPath
        to: inputs/goal-spec.json
        inputField: goalSpecPath
        required: true
    route:
      key: candidate
  - id: goal-hunt-exhausted-to-goal-surface
    name: goal-hunt-exhausted-to-goal-surface
    from: goal-hunt
    to: goal-surface
    fork: false
    mode: map
    input:
      goalSpecPath: $input.goalSpecPath
      goalSpec: $input.goalSpec
      feedback:
        kind: hunt-exhausted
        huntGoalId: $input.huntGoal.huntGoalId
        candidateId: null
        summary: $output.exhaustion.reason
        payload: $output.exhaustion
    artifacts:
      - from: $input.goalSpecPath
        to: inputs/goal-spec.json
        inputField: goalSpecPath
        required: true
    route:
      key: exhausted
  - id: goal-judge-to-goal-dedup
    name: goal-judge-to-goal-dedup
    from: goal-judge
    to: goal-dedup
    fork: false
    mode: map
    input:
      goalSpecPath: $input.goalSpecPath
      goalSpec: $input.goalSpec
      huntGoal: $input.huntGoal
      candidate: $input.candidate
      judge: $output
    artifacts:
      - from: $input.goalSpecPath
        to: inputs/goal-spec.json
        inputField: goalSpecPath
        required: true
    route:
      key: confirmed
  - id: goal-judge-reject-to-goal-surface
    name: goal-judge-reject-to-goal-surface
    from: goal-judge
    to: goal-surface
    fork: false
    mode: map
    input:
      goalSpecPath: $input.goalSpecPath
      goalSpec: $input.goalSpec
      feedback:
        kind: judge-reject
        huntGoalId: $input.huntGoal.huntGoalId
        candidateId: $input.candidate.candidateId
        summary: $output.summary
        payload: $output
    artifacts:
      - from: $input.goalSpecPath
        to: inputs/goal-spec.json
        inputField: goalSpecPath
        required: true
    route:
      key: rejected
      default: true
  - id: goal-dedup-novel-to-goal-surface
    name: goal-dedup-novel-to-goal-surface
    from: goal-dedup
    to: goal-surface
    fork: false
    mode: map
    input:
      goalSpecPath: $input.goalSpecPath
      goalSpec: $input.goalSpec
      feedback:
        kind: dedup-novel
        huntGoalId: $input.huntGoal.huntGoalId
        candidateId: $input.candidate.candidateId
        summary: $output.summary
        payload: $output
    artifacts:
      - from: $input.goalSpecPath
        to: inputs/goal-spec.json
        inputField: goalSpecPath
        required: true
    route:
      key: novel
  - id: goal-dedup-reject-to-goal-surface
    name: goal-dedup-reject-to-goal-surface
    from: goal-dedup
    to: goal-surface
    fork: false
    mode: map
    input:
      goalSpecPath: $input.goalSpecPath
      goalSpec: $input.goalSpec
      feedback:
        kind: dedup-reject
        huntGoalId: $input.huntGoal.huntGoalId
        candidateId: $input.candidate.candidateId
        summary: $output.summary
        payload: $output
    artifacts:
      - from: $input.goalSpecPath
        to: inputs/goal-spec.json
        inputField: goalSpecPath
        required: true
    route:
      key: reject
      default: true
groups: []
