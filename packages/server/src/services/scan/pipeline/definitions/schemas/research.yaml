ResearchScopeStageInput:
  type: object
  additionalProperties: false
  properties: {}
  required: []

ResearchScope:
  type: object
  additionalProperties: false
  properties:
    attackerModel: { type: object }
    trustedDomain: { type: object }
    protectedAssets: { type: array, items: { type: string } }
    deploymentAssumptions: { type: array, items: { type: string } }
    rulesOfEngagement: { type: array, items: { type: string } }
    minimumResearchDeadlineAt: { type: string }
    successCriteria: { type: object }
  required: [attackerModel, trustedDomain, protectedAssets, deploymentAssumptions, rulesOfEngagement, minimumResearchDeadlineAt, successCriteria]

ScopeManifest:
  type: object
  additionalProperties: false
  properties:
    scopePath: { type: string }
  required: [scopePath]

SurfaceMap:
  type: object
  additionalProperties: false
  properties:
    entrypoints: { type: array, items: { type: object } }
    trustBoundaries: { type: array, items: { type: object } }
    sources: { type: array, items: { type: object } }
    sinks: { type: array, items: { type: object } }
    components: { type: array, items: { type: object } }
    dependencyFlows: { type: array, items: { type: object } }
    coverage: { type: object }
    openQuestions: { type: array, items: { type: string } }
  required: [entrypoints, trustBoundaries, sources, sinks, components, dependencyFlows, coverage, openQuestions]

SurfaceMapManifest:
  type: object
  additionalProperties: false
  properties:
    surfaceMapPath: { type: string }
  required: [surfaceMapPath]

TrackPlan:
  type: object
  additionalProperties: false
  properties:
    tracks: { type: array, items: { $ref: "#/schemas/ResearchTrack" } }
    iteration: { type: integer }
  required: [tracks, iteration]

ResearchTrack:
  type: object
  additionalProperties: false
  properties:
    trackKey: { type: string, minLength: 1 }
    approachFamily: { type: string, minLength: 1 }
    researchIdea: { type: string, minLength: 1 }
    scope: { type: object }
    mechanisms: { type: array, items: { type: string } }
    coverage: { type: object }
    evidenceRefs: { type: array, items: { type: string } }
    findingIds: { type: array, items: { type: string } }
    nextStep: { type: string }
    status: { type: string, enum: [queued, active, blocked, exhausted] }
  required: [trackKey, approachFamily, researchIdea, scope, mechanisms]

ResearchTrackReference:
  type: object
  additionalProperties: false
  properties:
    trackKey: { type: string, minLength: 1 }
    approachFamily: { type: string, minLength: 1 }
    researchIdea: { type: string, minLength: 1 }
    scope: { type: object }
    mechanisms: { type: array, items: { type: string } }
    coverage: { type: object }
    evidenceRefs: { type: array, items: { type: string } }
    findingIds: { type: array, items: { type: string } }
    nextStep: { type: string }
  required: [trackKey]

Finding:
  type: object
  additionalProperties: false
  properties:
    findingId: { type: string, minLength: 1 }
    trackKey: { type: string, minLength: 1 }
    title: { type: string, minLength: 1 }
    description: { type: string, minLength: 1 }
    vulnerabilityClass: { type: [string, "null"] }
    location:
      type: object
      additionalProperties: false
      properties:
        filePath: { type: string, minLength: 1 }
        line: { type: [integer, "null"] }
        symbol: { type: [string, "null"] }
      required: [filePath, line, symbol]
    claim: { type: string, minLength: 1 }
    rootCauseKey: { type: string, minLength: 1 }
    source: { type: object }
    sink: { type: object }
    attackerControl: { type: string, minLength: 1 }
    trustBoundaryCrossings: { type: array, items: { type: object } }
    preconditions: { type: array, items: { type: string } }
    evidence:
      type: array
      items:
        type: object
        additionalProperties: false
        properties:
          id: { type: string, minLength: 1 }
          kind: { type: string, minLength: 1 }
          summary: { type: string, minLength: 1 }
          filePath: { type: [string, "null"] }
          line: { type: [integer, "null"] }
          symbol: { type: [string, "null"] }
          observation: { type: string, minLength: 1 }
          supports: { type: array, items: { type: string } }
          contradicts: { type: array, items: { type: string } }
        required: [id, kind, summary, filePath, line, symbol, observation, supports, contradicts]
    quickDisproofAttempt: { type: string, minLength: 1 }
    confidence: { type: number, minimum: 0, maximum: 1 }
  required: [findingId, trackKey, title, description, vulnerabilityClass, location, claim, rootCauseKey, source, sink, attackerControl, trustBoundaryCrossings, preconditions, evidence, quickDisproofAttempt, confidence]

DiscoveryReport:
  type: object
  additionalProperties: false
  properties:
    trackId: { type: string }
    source: { type: object }
    transformations: { type: array, items: { type: object } }
    guards: { type: array, items: { type: object } }
    sink: { type: object }
    reachability: { type: object }
    attackerControl: { type: object }
    preconditions: { type: array, items: { type: string } }
    findingPaths:
      type: array
      items:
        $pathOf: "#/schemas/Finding"
    quickDisproofAttempt: { type: object }
    newTrackSuggestions: { type: array, items: { type: object } }
  required: [trackId, source, transformations, guards, sink, reachability, attackerControl, preconditions, findingPaths, quickDisproofAttempt, newTrackSuggestions]

DiscoveryManifest:
  type: object
  additionalProperties: false
  properties:
    trackId: { type: string }
    discoveryReportPath:
      $pathOf: "#/schemas/DiscoveryReport"
  required: [trackId, discoveryReportPath]

TrackReview:
  type: object
  additionalProperties: false
  properties:
    trackKey: { type: string, minLength: 1 }
    decision: { type: string, enum: [continue, finding-found, new-surface, blocked, exhausted] }
    summary: { type: string, minLength: 1 }
    findingIds: { type: array, items: { type: string } }
    coverageGaps: { type: array, items: { type: string } }
    nextStep:
      anyOf:
        - { type: string, minLength: 1 }
        - { type: "null" }
    blockReason:
      anyOf:
        - { type: string, minLength: 1 }
        - { type: "null" }
    reopenCondition:
      anyOf:
        - { type: string, minLength: 1 }
        - { type: "null" }
  required: [trackKey, decision, summary, findingIds, coverageGaps, nextStep, blockReason, reopenCondition]

FindingValidation:
  type: object
  additionalProperties: false
  properties:
    findingId: { type: string }
    reachability: { type: object }
    controllability: { type: object }
    trustBoundaryCrossings: { type: array, items: { type: object } }
    guardAnalysis: { type: object }
    deploymentConditions: { type: array, items: { type: string } }
    primitive:
      anyOf:
        - { $ref: "#/schemas/ResearchPrimitive" }
        - { type: object, additionalProperties: false, properties: {} }
    evidenceRefs: { type: array, items: { type: string } }
    disproofResult: { type: object }
    verdict: { type: string }
  required: [findingId, reachability, controllability, trustBoundaryCrossings, guardAnalysis, deploymentConditions, primitive, evidenceRefs, disproofResult, verdict]

FindingReview:
  type: object
  additionalProperties: false
  properties:
    findingId: { type: string }
    decision: { type: string, enum: [confirmed, needs-more-evidence, false-positive] }
    summary: { type: string }
    challenges: { type: array, items: { type: object } }
    requiredEvidence: { type: array, items: { type: string } }
    confirmedPrimitive:
      anyOf:
        - { $ref: "#/schemas/ResearchPrimitive" }
        - { type: object, additionalProperties: false, properties: {} }
  required: [findingId, decision, summary, challenges, requiredEvidence, confirmedPrimitive]

ResearchPrimitive:
  type: object
  additionalProperties: false
  properties:
    primitiveId: { type: string, minLength: 1 }
    name: { type: string, minLength: 1 }
    capability: { type: string, minLength: 1 }
    requiredInput: { type: object }
    producedCapability: { type: object }
    trustLevel: { type: string, minLength: 1 }
    evidenceRefs: { type: array, items: { type: string } }
  required: [primitiveId, name, capability, requiredInput, producedCapability, trustLevel, evidenceRefs]

ChainSynthesis:
  type: object
  additionalProperties: false
  properties:
    chains: { type: array, items: { $ref: "#/schemas/ResearchChain" } }
  required: [chains]

ResearchChain:
  type: object
  additionalProperties: false
  properties:
    chainId: { type: string, minLength: 1 }
    chainKey: { type: string, minLength: 1 }
    status: { type: string, enum: [candidate, incomplete, accepted, confirmed, primitive-gap, revise-chain] }
    steps: { type: array, minItems: 1, items: { $ref: "#/schemas/ResearchChainStep" } }
    entrypoint: { type: object }
    requiredCapabilities: { type: array, items: { type: string } }
    producedCapabilities: { type: array, items: { type: string } }
    trustBoundaryCrossings: { type: array, items: { type: object } }
    deploymentConditions: { type: array, items: { type: string } }
    primitiveGaps: { type: array, items: { type: object } }
    successTarget: { type: object }
  required: [chainId, chainKey, status, steps, entrypoint, requiredCapabilities, producedCapabilities, trustBoundaryCrossings, deploymentConditions, primitiveGaps, successTarget]

ResearchChainStep:
  type: object
  additionalProperties: false
  properties:
    primitiveId: { type: string, minLength: 1 }
    findingId: { type: string, minLength: 1 }
    entrypoint: { type: object }
    requiredCapabilities: { type: array, items: { type: string } }
    producedCapabilities: { type: array, items: { type: string } }
    trustBoundaryCrossings: { type: array, items: { type: object } }
    deploymentConditions: { type: array, items: { type: string } }
  required: [primitiveId]

ChainReview:
  type: object
  additionalProperties: false
  properties:
    chainId: { type: string, minLength: 1 }
    decision: { type: string, enum: [accepted, revise-chain, primitive-gap, invalid-finding] }
    brokenTransitions: { type: array, items: { type: object } }
    invalidatedFindings: { type: array, items: { type: string } }
    invalidFindingId: { type: [string, "null"] }
    requiredRevisions: { type: array, items: { type: string } }
  required: [chainId, decision, brokenTransitions, invalidatedFindings, invalidFindingId, requiredRevisions]

ExploitValidation:
  type: object
  additionalProperties: false
  properties:
    chainId: { type: string, minLength: 1 }
    steps: { type: array, items: { type: object } }
    evidenceRefs: { type: array, items: { type: string } }
    executionContext: { type: object }
    failurePoint: { type: [object, "null"] }
    successCriteriaResult: { type: string, enum: [not_attempted, satisfied, not_satisfied, inconclusive] }
    verdict: { type: string }
  required: [chainId, steps, evidenceRefs, executionContext, failurePoint, successCriteriaResult, verdict]

ExploitReview:
  type: object
  additionalProperties: false
  properties:
    chainId: { type: string, minLength: 1 }
    decision: { type: string, enum: [confirmed, runtime-retry, chain-revision, finding-revalidation] }
    reproducibility: { type: object }
    environmentAssumptions: { type: array, items: { type: string } }
    invalidatedSteps: { type: array, items: { type: object } }
    invalidFindingId: { type: [string, "null"] }
  required: [chainId, decision, reproducibility, environmentAssumptions, invalidatedSteps, invalidFindingId]

ResearchReport:
  type: object
  additionalProperties: false
  properties:
    chainId: { type: string }
    reportPath: { type: string }
    verdict: { type: string }
  required: [chainId, reportPath, verdict]
