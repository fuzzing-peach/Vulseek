analyze-finding:
  key: analyzeFinding
  name: Analyze Finding
  taskName: "Candidate Analysis: $file($input.candidatePath).title"
  role: analysis
  group: review
  concurrency: 2
  maxConcurrency: 16
  disableable: true
  description: Candidate analysis and critic routing.
  runtimeConfig:
    persistent: false
    reuseContainer: true
    mode: fanout
    nullableOutput: false
    cwd: /workspace/repo
    skills: [analyze-finding]
    promptFile: analyze-finding.prompt.md
  promptValues:
    scanJobId: "$ctx.scanJobId"
    candidateId: "$file($input.candidatePath).id"
    candidateTitle: "$file($input.candidatePath).title"
    candidateDescription: "$file($input.candidatePath).description"
    candidateFile: "$file($input.candidatePath).filePath"
    candidateLine: "$file($input.candidatePath).line"
    repositoryJsonPath: "$input.repositoryPath"
    moduleJsonPath: "$input.modulePath"
    functionJsonPath: "$input.functionPath"
    candidateJsonPath: "$input.candidatePath"
    analysisReportTemplatePath: "$input.analysisReportTemplatePath"
    taskDir: "$ctx.taskDir"
    reportPath: "/task/01_report.md"
    feedbackJsonPath: "$input.feedbackPath"
    taskId: "$ctx.taskId"
  report: { path: /task/01_report.md, required: true }
  effects:
    - type: project-candidate-result
      resultStage: analyze
  inputSchema:
    $ref: "#/schemas/AnalyzeFindingStageInput"
  outputSchema:
    $ref: "#/schemas/Analysis"
