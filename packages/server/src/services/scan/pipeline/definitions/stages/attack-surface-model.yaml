attack-surface-model:
  key: attackSurfaceModel
  name: Attack Surface Model
  taskName: "$file($input.modulePath).name"
  role: scan
  group: full-scan
  concurrency: 4
  disableable: true
  description: Module-level threat and attack-surface modeling.
  runtimeConfig:
    persistent: false
    reuseContainer: true
    mode: fanout
    nullableOutput: false
    cwd: /workspace/repo
    skills: [attack-surface-model]
    promptFile: attack-surface-model.prompt.md
  promptValues:
    scanJobId: "$ctx.scanJobId"
    moduleId: "$file($input.modulePath).id"
    moduleName: "$file($input.modulePath).name"
    repositoryJsonPath: "$input.repositoryPath"
    moduleJsonPath: "$input.modulePath"
  inputSchema:
    $ref: "#/schemas/AttackSurfaceModelStageInput"
  outputSchema:
    $ref: "#/schemas/ModuleThreatModelManifest"
