critique-finding:
  key: critiqueFinding
  name: Critique Finding
  taskName: "Analysis Critic: $file($input.candidatePath).title"
  role: analysis
  group: review
  concurrency: 2
  maxConcurrency: 16
  disableable: true
  description: Challenge analysis results before verification.
  runtimeConfig:
    persistent: false
    reuseContainer: true
    mode: fanout
    nullableOutput: false
    cwd: /workspace/repo
    skills: [critique-finding]
    promptFile: critique-finding.prompt.md
  promptValues:
    candidateId: "$file($input.candidatePath).id"
    candidateTitle: "$file($input.candidatePath).title"
    taskDir: "$ctx.taskDir"
    analysisFingerprint: "$input.analysisFingerprint"
    candidateJsonPath: "$input.candidatePath"
    draftAnalysisJsonPath: "$input.draftAnalysisPath"
    taskId: "$ctx.taskId"
  inputSchema:
    $ref: "#/schemas/CritiqueFindingStageInput"
  outputSchema:
    $ref: "#/schemas/CriticResponse"
