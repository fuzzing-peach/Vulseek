repository-profile:
  key: repositoryProfile
  name: Repository Profile
  taskName: "$ctx.projectName"
  role: scan
  group: full-scan
  concurrency: 1
  disableable: false
  description: Repository-wide runtime and security surface profiling.
  runtimeConfig:
    persistent: false
    reuseContainer: true
    nullableOutput: false
    cwd: /workspace/repo
    skills: [repository-profile]
    promptFile: repository-profile.prompt.md
  promptValues:
    repositoryId: "$ctx.taskId"
    repositoryName: "$ctx.serviceName"
    targetRef: "$ctx.scanJob.targetRef"
    targetTag: "$ctx.scanJob.targetTag"
    targetCommit: "$ctx.scanJob.commitSha"
    agentInstruction: "Use the configured scan agent."
    repositoryStatePath: "$ctx.taskDir/00_repository_state.json"
    prepareRepository: true
  inputSchema:
    $ref: "#/schemas/NullStageInput"
  outputSchema:
    $ref: "#/schemas/RepositoryProfileManifest"
