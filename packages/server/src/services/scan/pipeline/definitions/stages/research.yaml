research-scope:
  key: researchScope
  name: Research Scope
  role: scan
  group: research
  concurrency: 1
  disableable: false
  description: Define the attacker model, trusted domain, protected assets, and success criteria for this research job.
  runtimeConfig:
    persistent: false
    reuseContainer: true
    cwd: /workspace/repo
    skills: [research-agent, research-db]
    promptFile: research-scope.prompt.md
    prepareRepository: true
  inputSchema:
    $ref: "#/schemas/ResearchScopeStageInput"
  outputSchema:
    $ref: "#/schemas/ScopeManifest"

surface-map:
  key: surfaceMap
  name: Surface Mapping
  role: scan
  group: research
  concurrency: 1
  disableable: false
  description: Map attacker-facing entrypoints, trust boundaries, sources, sinks, and dependency flows.
  runtimeConfig:
    persistent: false
    reuseContainer: true
    cwd: /workspace/repo
    skills: [research-agent]
    promptFile: surface-map.prompt.md
  inputSchema:
    type: object
  outputSchema:
    $ref: "#/schemas/SurfaceMapManifest"

track-plan:
  key: trackPlan
  name: Track Planning
  role: scan
  group: research
  concurrency: 1
  description: Select diverse research tracks from surface coverage and Registry state.
  runtimeConfig:
    persistent: false
    reuseContainer: true
    cwd: /workspace/repo
    skills: [research-agent, research-db]
    promptFile: track-plan.prompt.md
  inputSchema:
    type: object
  outputSchema:
    $ref: "#/schemas/TrackPlan"

vulnerability-discovery:
  key: vulnerabilityDiscovery
  name: Vulnerability Discovery
  role: scan
  group: research
  concurrency: 8
  description: Trace attacker-controlled data through one assigned research track.
  runtimeConfig:
    persistent: false
    reuseContainer: true
    cwd: /workspace/repo
    skills: [research-agent, research-db]
    promptFile: vulnerability-discovery.prompt.md
  inputSchema:
    type: object
  outputSchema:
    $ref: "#/schemas/DiscoveryManifest"

track-review:
  key: trackReview
  name: Track Review
  role: verification
  group: research
  concurrency: 4
  description: Review discovery results and route tracks, findings, or new surfaces.
  runtimeConfig:
    persistent: false
    reuseContainer: true
    cwd: /workspace/repo
    skills: [research-agent, research-db]
    promptFile: track-review.prompt.md
  inputSchema:
    type: object
  outputSchema:
    $ref: "#/schemas/TrackReview"

finding-validation:
  key: findingValidation
  name: Finding Validation
  role: analysis
  group: research
  concurrency: 8
  description: Validate one finding and characterize the supported capability.
  runtimeConfig:
    persistent: false
    reuseContainer: true
    cwd: /workspace/repo
    skills: [research-agent, research-db]
    promptFile: finding-validation.prompt.md
  inputSchema:
    type: object
  outputSchema:
    $ref: "#/schemas/FindingValidation"

finding-review:
  key: findingReview
  name: Finding Review
  role: verification
  group: research
  concurrency: 4
  description: Independently challenge one finding validation result.
  runtimeConfig:
    persistent: false
    reuseContainer: true
    cwd: /workspace/repo
    skills: [research-agent, research-db]
    promptFile: finding-review.prompt.md
  inputSchema:
    type: object
  outputSchema:
    $ref: "#/schemas/FindingReview"

chain-synthesis:
  key: chainSynthesis
  name: Chain Synthesis
  role: analysis
  group: research
  concurrency: 1
  description: Combine confirmed capabilities into exploit chains and identify gaps.
  runtimeConfig:
    persistent: false
    reuseContainer: true
    cwd: /workspace/repo
    skills: [research-agent, research-db]
    promptFile: chain-synthesis.prompt.md
  inputSchema:
    type: object
  outputSchema:
    $ref: "#/schemas/ChainSynthesis"

chain-review:
  key: chainReview
  name: Chain Review
  role: verification
  group: research
  concurrency: 4
  description: Audit the continuity and assumptions of one exploit chain.
  runtimeConfig:
    persistent: false
    reuseContainer: true
    cwd: /workspace/repo
    skills: [research-agent, research-db]
    promptFile: chain-review.prompt.md
  inputSchema:
    type: object
  outputSchema:
    $ref: "#/schemas/ChainReview"

exploit-validation:
  key: exploitValidation
  name: Exploit Validation
  role: verification
  group: research
  concurrency: 4
  description: Perform source-only validation against the configured success criteria.
  runtimeConfig:
    persistent: false
    reuseContainer: true
    cwd: /workspace/repo
    skills: [research-agent, research-db]
    promptFile: exploit-validation.prompt.md
  inputSchema:
    type: object
  outputSchema:
    $ref: "#/schemas/ExploitValidation"

exploit-review:
  key: exploitReview
  name: Exploit Review
  role: verification
  group: research
  concurrency: 4
  description: Independently review the source-only chain validation.
  runtimeConfig:
    persistent: false
    reuseContainer: true
    cwd: /workspace/repo
    skills: [research-agent, research-db]
    promptFile: exploit-review.prompt.md
  inputSchema:
    type: object
  outputSchema:
    $ref: "#/schemas/ExploitReview"

research-report:
  key: researchReport
  name: Research Report
  role: verification
  group: research
  concurrency: 2
  disableable: false
  description: Produce the final evidence-backed report for the configured research criteria.
  runtimeConfig:
    persistent: false
    reuseContainer: true
    cwd: /workspace/repo
    skills: [research-agent, research-db]
    promptFile: research-report.prompt.md
  inputSchema:
    type: object
  outputSchema:
    $ref: "#/schemas/ResearchReport"
  report:
    path: reports/final-report.md
    required: true
